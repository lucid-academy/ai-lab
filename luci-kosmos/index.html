    setTimeout(closeTask, TK.t.explain ? 2400 : 1300);
  } else {
    b.classList.add('wrong'); b.disabled = true; Snd.wrong(); TK.tries++;
    Voice.say(pick(SAY.wrong));
    if (TK.tries >= 2) { const ok = TK.t.opts.find(x => x.ok); if (ok && ok.el) ok.el.classList.add('hint'); }
  }
}
function closeTask() {
  if (scene !== 'task') return;
  TK = null;
  showScreen(null);
  scene = 'play';
  $('pad').classList.remove('hide'); $('hud').classList.remove('hide');
  chestOpen();
}

/* ================= ekrany, układ, sterowanie ================= */
const SA = { t: 0, r: 0, b: 0, l: 0 };
const hero = { x: 0, y: 0, w: 0, h: 0, size: 0 };
const heroSt = { squash: 0, happyT: 0, lookX: 0, lookY: 0.3 };
let mapPlanet = 0, TR = null, padPending = null;

const ICON = {
  mus: '<svg viewBox="0 0 24 24"><path d="M19 3v11.6A3 3 0 1 1 17 12V7.3L10 8.7v8A3 3 0 1 1 8 14V5.5z"/></svg>',
  musOff: '<svg viewBox="0 0 24 24"><path d="M19 3v11.6A3 3 0 1 1 17 12V7.3L10 8.7v8A3 3 0 1 1 8 14V5.5z"/><path d="M3 3l18 18" stroke="#ff8fa3" stroke-width="2.6" stroke-linecap="round"/></svg>',
  sndOn: '<svg viewBox="0 0 24 24"><path d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path d="M15.5 8.8a4.5 4.5 0 0 1 0 6.4M18 6.3a8 8 0 0 1 0 11.4" stroke="#d6f6ff" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>',
  sndOff: '<svg viewBox="0 0 24 24"><path d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path d="m15.5 9.5 5 5m0-5-5 5" stroke="#ff8fa3" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>',
};

function readSafe() {
  const cs = getComputedStyle($('sa'));
  SA.t = parseFloat(cs.paddingTop) || 0; SA.r = parseFloat(cs.paddingRight) || 0;
  SA.b = parseFloat(cs.paddingBottom) || 0; SA.l = parseFloat(cs.paddingLeft) || 0;
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const k in bgCache) delete bgCache[k];
  readSafe();
  const k = ambKind; ambKind = null; if (k) setAmb(k);
  layoutPlay();
  updateHero();
}
function layoutPlay() {
  if (!L) return;
  const hud = $('hud'), pad = $('pad');
  const left = (hud.classList.contains('hide') ? 80 + SA.l : hud.getBoundingClientRect().right) + 4;
  const right = (pad.classList.contains('hide') ? W - 186 - SA.r : pad.getBoundingClientRect().left) - 10;
  const top = SA.t + 14, bottom = H - SA.b - 14;
  const aw = Math.max(100, right - left), ah = Math.max(80, bottom - top);
  const cell = Math.max(22, Math.floor(Math.min(aw / L.c, ah / L.r, 96)));
  L.cell = cell;
  L.ox = Math.round(left + (aw - cell * L.c) / 2);
  L.oy = Math.round(top + (ah - cell * L.r) / 2);
  renderMaze();
}
function updateHero() {
  const id = { title: 'sTitle', map: 'sMap', win: 'sWin', final: 'sFinal' }[scene];
  if (!id) return;
  const r = $(id).querySelector('.hero').getBoundingClientRect();
  hero.x = r.left + r.width / 2; hero.y = r.top + r.height / 2; hero.w = r.width; hero.h = r.height;
}
function showScreen(id) {
  for (const s of ['sTitle', 'sMap', 'sTask', 'sWin', 'sFinal', 'sTravel']) $(s).classList.toggle('hide', s !== id);
}
function setPlayUi(on) { $('hud').classList.toggle('hide', !on); $('pad').classList.toggle('hide', !on); }
function setToggles() {
  $$('.tgM').forEach(b => { b.innerHTML = save.music ? ICON.mus : ICON.musOff; b.classList.toggle('off', !save.music); });
  $$('.tgS').forEach(b => { b.innerHTML = save.sound ? ICON.sndOn : ICON.sndOff; b.classList.toggle('off', !save.sound); });
}

/* ---------- ekrany ---------- */
function goTitle() {
  scene = 'title'; L = null; TR = null;
  setPlayUi(false); showScreen('sTitle'); setAmb('space');
  Music.play('space'); Voice.stop(); updateHero();
}
function goMap(p) {
  scene = 'map'; L = null; TR = null;
  setPlayUi(false); Voice.stop();
  mapPlanet = p == null ? LEVELS[firstOpenLevel()].p : p;
  buildMap(); showScreen('sMap'); setAmb('space');
  Music.play(PLANETS[mapPlanet].music);
  updateHero();
}
function buildMap() {
  const box = $('planets'); box.innerHTML = '';
  PLANETS.forEach((P, k) => {
    const open = isUnlocked(k * PER_PLANET);
    const b = document.createElement('button');
    b.className = 'pl' + (k === mapPlanet ? ' sel' : '') + (open ? '' : ' lock');
    b.style.background = `radial-gradient(circle at 35% 30%, ${P.planet[0]}, ${P.planet[1]})`;
    b.setAttribute('aria-label', P.name);
    if (!open) b.innerHTML = ICON.lock;
    b.addEventListener('click', () => {
      Snd.init();
      if (!open) { Snd.thud(); return; }
      Snd.tap(); mapPlanet = k; buildMap(); Music.play(P.music); Voice.say(P.name);
    });
    box.appendChild(b);
  });
  const P = PLANETS[mapPlanet];
  $('pName').textContent = P.name;
  $('sMap').style.setProperty('--pc', P.pc);
  const grid = $('lvlGrid'); grid.innerHTML = '';
  const next = firstOpenLevel();
  for (let k = 0; k < PER_PLANET; k++) {
    const idx = mapPlanet * PER_PLANET + k;
    const wrap = document.createElement('div'); wrap.className = 'lv';
    const b = document.createElement('button'); b.textContent = k + 1;
    b.disabled = !isUnlocked(idx);
    if (isDone(idx)) b.classList.add('done');
    if (idx === next && !isDone(idx)) b.classList.add('next');
    b.addEventListener('click', () => { userStart(); Snd.tap(); startLevel(idx); });
    const st = document.createElement('div'); st.className = 'st';
    if (isDone(idx)) st.innerHTML = [0, 1, 2].map(j => starSvg(j < save.stars[idx])).join('');
    wrap.append(b, st); grid.appendChild(wrap);
  }
}
function startLevel(idx) {
  idx = clamp(idx, 0, LEVELS.length - 1);
  Voice.stop(); TR = null;
  L = buildLevel(idx); startLevelState(); parts.length = 0;
  scene = 'play'; showScreen(null); setPlayUi(true);
  setAmb(L.P.amb); Music.play(L.P.music);
  layoutPlay();
  const p = cellXY(L.start); luci.x = p.x; luci.y = p.y;
  buildHud(); setPadVisual(null);
  const cfg = L.cfg, prev = LEVELS[idx - 1];
  if (cfg.dinos > 0 && !(prev && prev.dinos > 0)) Voice.say(SAY.dinos, 500);
  else if (cfg.robots > 0 && !(prev && prev.robots > 0)) Voice.say(SAY.robots, 500);
}
function showWin() {
  L.phase = 'done';
  if (L.idx === LEVELS.length - 1) { showFinal(); return; }
  scene = 'win'; setPlayUi(false);
  const got = L.stars.filter(s => s.got).length;
  $('wStars').innerHTML = [0, 1, 2].map(k => starSvg(k < got, `animation-delay:${0.15 + k * 0.18}s`)).join('');
  showScreen('sWin'); updateHero();
}
function showFinal() {
  scene = 'final'; setPlayUi(false);
  $('fTtl').innerHTML = `Brawo,<br>${NAME}!`;
  showScreen('sFinal'); setAmb('space'); Music.play('space');
  Snd.fanfare(); confetti(120); updateHero();
}
function travel(p, then) {
  scene = 'travel'; setPlayUi(false); showScreen('sTravel'); setAmb('space'); Music.play('space');
  TR = { from: Math.max(0, p - 1), to: p, t: 0, then, done: false };
  Snd.rocket(); Voice.say(`Lecimy na ${PLANETS[p].say}!`, 300);
}
function endTravel() {
  if (!TR || TR.done) return;
  TR.done = true; const f = TR.then; TR = null; f();
}

/* ---------- bohaterowie na ekranach ---------- */
function orbitPlanets(cx, cy, s, under) {
  PLANETS.forEach((P, k) => {
    const a = T * 0.35 + k * TAU / 4, z = Math.sin(a);
    if ((z < 0) === under) drawPlanet(ctx, cx + Math.cos(a) * s * 0.9, cy + z * s * 0.3, s * (0.1 + 0.03 * z), k, T);
  });
}
function drawTitleHero() {
  const s = Math.min(hero.h * 0.62, hero.w * 0.55); hero.size = s;
  orbitPlanets(hero.x, hero.y, s, true);
  drawLuci(ctx, hero.x, hero.y + Math.sin(T * 1.6) * s * 0.03, s * 0.75, {
    blink: luci.blink, lookX: heroSt.lookX, lookY: heroSt.lookY, mood: heroSt.happyT > 0 ? 'happy' : 'idle',
    squash: heroSt.squash, tilt: Math.sin(T * 1.1) * 0.06, helmet: true });
  orbitPlanets(hero.x, hero.y, s, false);
}
function drawMapHero() {
  const R = Math.min(hero.w, hero.h) * 0.36;
  drawPlanet(ctx, hero.x - R * 0.1, hero.y, R, mapPlanet, T);
  drawLuci(ctx, hero.x + R * 0.95, hero.y + R * 0.55 + Math.sin(T * 1.8) * R * 0.05, R * 0.7, {
    blink: luci.blink, lookX: -0.6, lookY: -0.3, tilt: -0.15, helmet: true });
}
function drawWinHero() {
  const s = Math.min(hero.h * 0.62, hero.w * 0.48);
  drawChest(ctx, hero.x - s * 0.5, hero.y + s * 0.3, s * 0.7, true);
  drawLuci(ctx, hero.x + s * 0.22, hero.y - Math.abs(Math.sin(T * 4)) * s * 0.1, s * 0.8, {
    blink: luci.blink, mood: 'happy', tilt: Math.sin(T * 4) * 0.08, helmet: L && L.P.helmet });
}
function drawFinalHero() {
  const s = Math.min(hero.h * 0.6, hero.w * 0.55);
  orbitPlanets(hero.x, hero.y, s, true);
  drawLuci(ctx, hero.x, hero.y - Math.abs(Math.sin(T * 3.5)) * s * 0.06, s * 0.78, { blink: luci.blink, mood: 'happy', tilt: Math.sin(T * 3.5) * 0.07, crown: true });
  orbitPlanets(hero.x, hero.y, s, false);
}
function drawTravel() {
  if (!TR) return;
  const e = smooth(clamp(TR.t / 3.3, 0, 1));
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 40; i++) {
    const sp = 0.5 + (i % 5) / 5, sx = (i * 137.5 + T * 420 * sp) % (W + 100);
    const x = W - sx + 50, y = (i * 53.3) % H;
    ctx.strokeStyle = `rgba(255,255,255,${0.25 + 0.4 * sp})`;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 34 * sp, y); ctx.stroke();
  }
  drawPlanet(ctx, W * 0.16 - e * W * 0.1, H * 0.64, H * 0.17 * (1 - e * 0.35), TR.from, T);
  drawPlanet(ctx, W * 0.84 - (1 - e) * W * 0.04, H * 0.4, H * (0.08 + 0.16 * e), TR.to, T);
  const p0 = { x: W * 0.2, y: H * 0.58 }, p1 = { x: W * 0.5, y: H * 0.02 }, p2 = { x: W * 0.76, y: H * 0.42 };
  const bz = t => ({ x: (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x, y: (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y });
  const tt = e * 0.92, pos = bz(tt), nx = bz(Math.min(1, tt + 0.01));
  const ang = Math.atan2(nx.y - pos.y, nx.x - pos.x) + Math.PI / 2;
  if (Math.random() < 0.7) spawn({ k: 'b', x: pos.x - Math.sin(ang) * H * 0.15, y: pos.y + Math.cos(ang) * H * 0.15, vx: rand(-25, 25), vy: rand(-25, 25), r: rand(2, 5), life: 0.8, max: 0.8 });
  drawRocket(ctx, pos.x, pos.y, H * 0.3, ang);
}

/* ---------- pętla ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  const paused = H > W || document.hidden;
  if (!paused) {
    T += dt;
    updAmb(dt); updBlink(dt);
    heroSt.squash = approach(heroSt.squash, 0, 7, dt);
    if (heroSt.happyT > 0) heroSt.happyT -= dt;
    if (L && (scene === 'play' || scene === 'task')) updatePlay(dt);
    if (scene === 'travel' && TR) { TR.t += dt; if (TR.t > 3.6) endTravel(); }
    if (scene === 'final' && Math.random() < dt * 5) confetti(3);
    updParts(dt);
  }
  draw();
  requestAnimationFrame(frame);
}
function draw() {
  const kind = (L && (scene === 'play' || scene === 'task' || scene === 'win')) ? L.P.id : 'space';
  ctx.drawImage(getBg(kind), 0, 0, W, H);
  drawAmb();
  if (scene === 'play' || scene === 'task') { if (L) drawPlay(); }
  else if (scene === 'title') drawTitleHero();
  else if (scene === 'map') drawMapHero();
  else if (scene === 'win') drawWinHero();
  else if (scene === 'final') drawFinalHero();
  else if (scene === 'travel') drawTravel();
  drawParts();
}

/* ---------- sterowanie ---------- */
let wakeLock = null;
function keepAwake() {
  try { if (navigator.wakeLock && !wakeLock) navigator.wakeLock.request('screen').then(w => { wakeLock = w; w.addEventListener('release', () => { wakeLock = null; }); }).catch(() => {}); } catch (e) {}
}
function goFull() {
  try {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) {
      el.requestFullscreen({ navigationUI: 'hide' }).then(() => {
        try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
      }).catch(() => {});
    }
  } catch (e) {}
}
function userStart() { Snd.init(); keepAwake(); }

const pad = $('pad');
let padId = null;
function setPadVisual(d) { ['up', 'rt', 'dn', 'lf'].forEach((c, k) => pad.querySelector('.' + c).classList.toggle('on', k === d)); }
function setPad(d) { if (d !== padDir) { padDir = d; setPadVisual(d); if (d != null) { target = null; padPending = d; } } }
function padFromEvent(e) {
  const r = pad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  if (Math.hypot(dx, dy) < r.width * 0.12) return null;
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
}
pad.addEventListener('pointerdown', e => {
  e.preventDefault(); userStart();
  padId = e.pointerId;
  try { pad.setPointerCapture(e.pointerId); } catch (_) {}
  setPad(padFromEvent(e));
});
pad.addEventListener('pointermove', e => { if (e.pointerId === padId) setPad(padFromEvent(e)); });
const padUp = e => { if (e.pointerId !== padId) return; padId = null; setPad(null); };
pad.addEventListener('pointerup', padUp);
pad.addEventListener('pointercancel', padUp);
const KEYS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 };
addEventListener('keydown', e => {
  if (!(e.key in KEYS) || scene !== 'play') return;
  e.preventDefault(); Snd.init();
  setPad(KEYS[e.key]);
});
addEventListener('keyup', e => { if (e.key in KEYS && padDir === KEYS[e.key]) setPad(null); });

function toCell(e) { return { x: (e.clientX - L.ox) / L.cell, y: (e.clientY - L.oy) / L.cell }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); Snd.init();
  if (scene === 'title') {
    if (Math.hypot(e.clientX - hero.x, e.clientY - hero.y) < hero.size * 0.5) {
      heroSt.squash = 1; heroSt.happyT = 0.9; Snd.giggle(); burstBubbles(e.clientX, e.clientY, 6, 20);
    }
    return;
  }
  if (scene !== 'play' || !L || L.phase !== 'play') return;
  ptr.down = true; ptr.id = e.pointerId; padPending = null;
  target = toCell(e);
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (scene === 'title') {
    const dx = e.clientX - hero.x, dy = e.clientY - hero.y, n = Math.hypot(dx, dy) || 1;
    heroSt.lookX = dx / n; heroSt.lookY = dy / n; return;
  }
  if (!ptr.down || e.pointerId !== ptr.id || !L) return;
  target = toCell(e);
});
const release = e => { if (e.pointerId !== ptr.id) return; ptr.down = false; ptr.id = null; };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
$('sTravel').addEventListener('pointerdown', () => { if (TR && TR.t > 0.6) endTravel(); });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Voice.stop(); try { Snd.ctx && Snd.ctx.suspend(); } catch (e) {} }
  else { try { Snd.ctx && Snd.ctx.resume(); } catch (e) {} if (scene !== 'title') keepAwake(); }
});

$('bStart').addEventListener('click', () => {
  userStart(); goFull(); Snd.tap();
  goMap();
  Voice.say(SAY.start, 200);
});
$('bToTitle').addEventListener('click', () => { Snd.tap(); goTitle(); });
$('bMap').addEventListener('click', () => { Snd.tap(); goMap(L ? L.cfg.p : null); });
$('bWinNext').addEventListener('click', () => {
  userStart(); Snd.tap();
  const n = L.idx + 1;
  if (LEVELS[n].p !== L.cfg.p) travel(LEVELS[n].p, () => startLevel(n)); else startLevel(n);
});
$('bWinMap').addEventListener('click', () => { Snd.tap(); goMap(LEVELS[Math.min(L.idx + 1, LEVELS.length - 1)].p); });
$('bFinal').addEventListener('click', () => { Snd.tap(); goMap(PLANETS.length - 1); });
$('bRepeat').addEventListener('click', () => { if (TK) Voice.say(TK.t.say); });
$$('.tgM').forEach(b => b.addEventListener('click', () => {
  save.music = !save.music; persist(); Snd.init(); Music.apply(); if (save.music) Music.restart(); setToggles();
}));
$$('.tgS').forEach(b => b.addEventListener('click', () => {
  save.sound = !save.sound; persist(); Snd.init(); if (!save.sound) Voice.stop(); else Snd.tap(); setToggles();
}));

if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

setToggles();
resize();
goTitle();
requestAnimationFrame(frame);


})();
</script>
</body>
