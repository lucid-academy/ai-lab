<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0F2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikona-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Luci w kosmosie</title>
<style>
  :root{--v:#7B2FFF;--c:#22D3EE;--m:#F0369F;--bg:#0B0F2E;
    --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;touch-action:none;color:#fff;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:none;padding:0;background:none}
  .hide{display:none!important}
  #sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

  .scr{position:fixed;inset:0;z-index:6;box-sizing:border-box;pointer-events:none;
    padding:calc(10px + var(--st)) calc(14px + var(--sr)) calc(10px + var(--sb)) calc(14px + var(--sl))}
  .scr button,.scr .tap{pointer-events:auto}
  .hero{pointer-events:none;min-height:0;min-width:0}
  .side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh}
  .row{display:flex;align-items:center;gap:28px}
  .corner{position:absolute;display:flex;gap:10px;z-index:2}
  .corner.tl{top:calc(10px + var(--st));left:calc(14px + var(--sl))}
  .corner.tr{top:calc(10px + var(--st));right:calc(14px + var(--sr))}

  .hb{width:46px;height:46px;border-radius:50%;border:2px solid rgba(34,211,238,.45);background:rgba(20,26,74,.82);display:grid;place-items:center;flex:none}
  .hb svg{width:24px;height:24px;fill:#d6f6ff}
  .hb.off{opacity:.4}
  .hb:active,.big:active,.mid:active,.ans:active{transform:scale(.92)}
  .big{width:min(108px,27vh);height:min(108px,27vh);border-radius:50%;display:grid;place-items:center;flex:none;
    background:radial-gradient(circle at 35% 30%,#C77DFF,#7B2FFF 55%,#4A0FB0);
    box-shadow:0 0 0 5px rgba(34,211,238,.35),0 0 36px rgba(123,47,255,.85);animation:pulse 1.6s ease-in-out infinite}
  .big svg{width:52%;height:52%;fill:#fff}
  .big.play svg{margin-left:9%}
  .mid{width:min(76px,19vh);height:min(76px,19vh);border-radius:50%;display:grid;place-items:center;flex:none;
    background:rgba(20,26,74,.85);border:3px solid rgba(34,211,238,.6)}
  .mid svg{width:48%;height:48%;fill:#d6f6ff}
  @keyframes pulse{50%{transform:scale(1.07)}}
  @keyframes pop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
  @keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
  @keyframes glow{50%{box-shadow:0 0 26px #FFD23F,0 0 0 4px #FFD23F}}
  .ttl{font-weight:800;font-size:min(62px,15vh);line-height:1;text-align:center;
    text-shadow:0 0 18px rgba(123,47,255,.95),0 0 4px rgba(34,211,238,.8)}
  .ttl small{display:block;font-size:.42em;font-weight:600;color:#a6f2ff;margin-top:8px;letter-spacing:2px}

  /* obróć telefon */
  #rotate{position:fixed;inset:0;z-index:50;background:#0B0F2E;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    color:#a6f2ff;font-weight:700;font-size:24px}
  #rotate svg{width:74px;animation:rot 2.2s ease-in-out infinite}
  @keyframes rot{0%,25%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait){#rotate{display:flex}}

  /* tytuł, wygrana, finał */
  #sTitle,#sWin,#sFinal{display:grid;grid-template-columns:1fr 1fr;align-items:stretch}
  #sTitle .hero,#sWin .hero,#sFinal .hero{height:100%}

  /* mapa */
  #sMap{display:grid;grid-template-columns:42% 58%;grid-template-rows:min(62px,16vh) 1fr}
  #planets{grid-column:1/3;display:flex;justify-content:center;align-items:center;gap:16px}
  .pl{width:min(50px,13vh);height:min(50px,13vh);border-radius:50%;position:relative;border:3px solid transparent;box-sizing:border-box}
  .pl.sel{border-color:#fff;box-shadow:0 0 16px rgba(255,255,255,.6)}
  .pl.lock{opacity:.35}
  .pl svg{position:absolute;inset:22%;width:56%;height:56%;fill:#fff}
  .mapL{display:flex;flex-direction:column;align-items:center;min-height:0}
  .mapL .hero{flex:1;width:100%}
  #pName{font-weight:800;font-size:min(22px,6vh);text-shadow:0 0 10px var(--v);padding-bottom:2px}
  #lvlGrid{display:grid;grid-template-columns:repeat(3,auto);justify-content:center;align-content:center;gap:3vh 30px}
  .lv{display:flex;flex-direction:column;align-items:center;gap:5px}
  .lv button{width:min(72px,17vh);height:min(72px,17vh);border-radius:50%;font-weight:800;font-size:min(30px,8vh);
    background:rgba(20,26,74,.88);border:3px solid var(--pc,#22D3EE)}
  .lv button.done{background:color-mix(in srgb,var(--pc,#22D3EE) 28%,rgba(20,26,74,.9))}
  .lv button.next{animation:pulse 1.4s infinite;box-shadow:0 0 18px var(--pc,#22D3EE)}
  .lv button:disabled{opacity:.28;border-color:rgba(255,255,255,.3)}
  .st{display:flex;gap:2px;height:min(18px,4.6vh)}
  .st svg{width:min(18px,4.6vh);height:min(18px,4.6vh)}

  /* gra */
  #hud{position:fixed;z-index:5;top:0;bottom:0;left:0;width:calc(80px + var(--sl));box-sizing:border-box;
    padding:calc(10px + var(--st)) 0 calc(10px + var(--sb)) var(--sl);display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
  #hud button{pointer-events:auto}
  #lvDots{display:flex;gap:4px}
  #lvDots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18)}
  #lvDots i.done{background:var(--c)}
  #lvDots i.cur{background:#fff;box-shadow:0 0 8px #fff}
  #sf{display:flex;gap:2px}
  #sf svg{width:23px;height:23px}
  #sf svg.got{animation:pop .45s}
  #items{display:flex;flex-direction:column;gap:10px;align-items:center}
  .it{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(20,26,74,.8);
    border:2px solid rgba(255,255,255,.25);animation:pop .4s}
  .it canvas{width:40px;height:40px}
  .it b{position:absolute;right:-7px;bottom:-5px;font-size:15px;line-height:20px;min-width:20px;text-align:center;background:#0B0F2E;border-radius:10px;border:1px solid rgba(255,255,255,.4)}
  .it.camo{background:conic-gradient(#F0ABFC calc(var(--p,1)*360deg),rgba(20,26,74,.8) 0)}

  #pad{position:fixed;z-index:5;right:calc(12px + var(--sr));bottom:calc(12px + var(--sb));width:min(172px,45vh);height:min(172px,45vh);border-radius:50%;
    background:radial-gradient(circle,rgba(20,26,74,.5) 0 58%,rgba(34,211,238,.1) 59% 100%);touch-action:none}
  #pad .ar{position:absolute;width:36%;height:36%;display:grid;place-items:center;border-radius:30%;pointer-events:none;
    background:rgba(123,47,255,.6);border:2px solid rgba(34,211,238,.65);box-sizing:border-box}
  #pad .ar svg{width:62%;height:62%;fill:#fff}
  #pad .ar.on{background:#22D3EE;box-shadow:0 0 18px #22D3EE}
  #pad .up{left:32%;top:0}
  #pad .dn{left:32%;bottom:0}
  #pad .dn svg{transform:rotate(180deg)}
  #pad .lf{left:0;top:32%}
  #pad .lf svg{transform:rotate(-90deg)}
  #pad .rt{right:0;top:32%}
  #pad .rt svg{transform:rotate(90deg)}

  /* zadanie */
  #sTask{background:rgba(6,9,32,.92);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2.2vh}
  #tTop{display:flex;align-items:center;gap:14px;width:100%;max-width:860px;flex:none}
  #bRepeat{width:54px;height:54px;pointer-events:auto}
  #bRepeat svg{width:28px;height:28px}
  #tQ{flex:1;font-weight:800;font-size:min(26px,6.6vh);line-height:1.2;color:#fff;background:rgba(123,47,255,.35);border:2px solid rgba(180,140,255,.5);
    border-radius:18px;padding:8px 16px;text-align:left}
  #tVis{flex:1;min-height:0;width:100%;max-width:820px;box-sizing:border-box;border-radius:26px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;gap:2vh 14px;flex-wrap:wrap;padding:10px 16px;font-size:min(44px,11vh);line-height:1.15;overflow:hidden}
  #tVis.light{background:#dff4ff}
  #tVis .grp{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px 4px;max-width:46%}
  #tVis .five{display:flex;gap:2px;padding:3px 6px;border-radius:12px;background:rgba(255,255,255,.07)}
  #tVis .op{font-weight:800;color:#a6f2ff;font-size:1.1em}
  #tVis .q{font-weight:800;color:#FFD23F;font-size:1.2em}
  #tVis .num{font-weight:800;font-size:1.25em;color:#fff;min-width:1.2em;text-align:center}
  #tVis .gone{opacity:.25;position:relative}
  #tVis .gone::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#ff5d73;font-weight:900;font-size:.9em}
  #tVis .obj{position:relative;cursor:pointer;pointer-events:auto}
  #tVis .obj i{position:absolute;right:-4px;top:-6px;font-style:normal;font-size:.36em;font-weight:800;background:#22D3EE;color:#08203a;border-radius:10px;min-width:1.5em;line-height:1.5em;text-align:center}
  #tVis .shadow{filter:brightness(0);font-size:1.9em}
  #tVis .lbl{display:block;font-size:.45em;font-weight:800;color:#a6f2ff;text-align:center}
  #tVis .col{display:flex;flex-direction:column;align-items:center}
  #tVis svg{width:1.6em;height:1.6em}
  #tAns{display:flex;gap:min(26px,3.5vw);justify-content:center;align-items:center;flex-wrap:nowrap}
  .ans{min-width:min(104px,25vh);height:min(104px,25vh);border-radius:24px;background:rgba(20,26,74,.94);border:3px solid rgba(34,211,238,.6);
    display:grid;place-items:center;font-size:min(50px,12vh);font-weight:800;padding:0 10px;box-sizing:border-box;flex:none;pointer-events:auto}
  .ans svg{width:78%;height:78%}
  .ans canvas{width:92%;height:92%}
  .ans.big2{min-width:min(220px,30vw);height:auto;min-height:min(140px,36vh);padding:8px 12px}
  .ans.wrong{opacity:.3;animation:shake .4s}
  .ans.hint{border-color:#FFD23F;animation:glow 1s infinite}
  .ans.ok{background:#15803d;border-color:#86efac;box-shadow:0 0 26px #22c55e}
  #tVis .ans{font-size:1em}
  #sTask.novis{justify-content:flex-start}
  #sTask.novis #tAns{flex:1}
  #sTask.novis .ans{min-width:min(140px,32vh);height:min(140px,32vh);font-size:min(66px,15vh)}

  #wStars{display:flex;gap:12px;min-height:64px}
  #wStars svg{width:64px;height:64px;animation:pop .5s backwards}
  #sTravel{pointer-events:auto}
  #sSplash{padding:0;pointer-events:auto;background:#0b0620;cursor:pointer}
  #sSplash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
  #sSplash p{position:absolute;left:0;right:0;bottom:calc(14px + var(--sb));margin:0;text-align:center;font-weight:800;font-size:min(26px,6.5vh);
    color:#fff;text-shadow:0 0 12px #7B2FFF,0 2px 6px #000;animation:pulse 1.8s ease-in-out infinite}
  #sSet,#sPhoto{pointer-events:auto}
  #sSet{background:rgba(6,9,32,.85);display:grid;place-items:center}
  #sSet .card{display:flex;flex-direction:column;gap:14px;align-items:stretch;min-width:min(440px,80vw)}
  #sSet h2{margin:0;font-size:min(26px,6.5vh)}
  #sSet .stat{color:#cfe9ff;font-weight:600;font-size:min(18px,4.6vh)}
  .wide{border-radius:16px;padding:12px 16px;font-weight:800;font-size:min(19px,4.8vh);background:rgba(123,47,255,.45);border:2px solid rgba(180,140,255,.7);text-align:left}
  .wide.danger{background:rgba(220,38,38,.35);border-color:rgba(255,120,120,.7)}
  .wide.ok{background:rgba(34,197,94,.35);border-color:rgba(134,239,172,.7)}
  #sSky{display:flex;flex-direction:column;justify-content:space-between;align-items:center}
  #skyTop{font-weight:800;font-size:min(26px,6.5vh);text-shadow:0 0 12px #7B2FFF;text-align:center}
  #skyMsg{font-weight:700;font-size:min(19px,4.8vh);text-align:left;max-width:560px;color:#fde68a;line-height:1.3}
  #skyBottom{width:100%;justify-content:center}
  #sSky .row{gap:22px}
  #sThanks{display:grid;grid-template-columns:44% 56%;align-items:stretch}
  #sThanks .hero{height:100%}
  #sThanks .side{gap:2.5vh}
  #thText{font-size:min(22px,5.6vh);line-height:1.35;font-weight:700;max-width:480px;text-align:center}
  #photoThumb{width:min(200px,40vh);aspect-ratio:1512/1123;object-fit:cover;border:8px solid #fff;border-bottom-width:26px;border-radius:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 30px rgba(244,114,182,.5);transform:rotate(-4deg);pointer-events:auto;cursor:pointer;animation:pop .8s backwards .6s}
  #sPhoto{background:#05030f;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #sPhoto img{max-width:100%;max-height:100%;object-fit:contain}
  #sPhoto p{position:absolute;left:0;right:0;bottom:calc(10px + var(--sb));margin:0;text-align:center;font-weight:900;font-size:min(48px,12vh);color:#fff;
    text-shadow:0 0 18px #F0369F,0 0 6px #7B2FFF}
  .pl .badge{position:absolute;right:-8px;top:-8px;background:#FACC15;color:#3b1d00;font-weight:900;font-size:12px;min-width:20px;line-height:20px;border-radius:10px;text-align:center}
  .lv button.missing{border-color:#FACC15;box-shadow:0 0 14px #FACC15}
  #bSky{width:auto;padding:0 12px;border-radius:23px;gap:6px;display:flex;align-items:center;font-weight:800;font-size:15px;color:#fde68a}
  #bSky svg{width:20px;height:20px;fill:#FACC15}
  #sIntro{display:grid;grid-template-columns:44% 56%;align-items:stretch}
  #sIntro .hero{height:100%}
  #sIntro .side{gap:3vh;align-items:flex-start;padding-right:10px}
  #iName{font-weight:800;font-size:min(34px,9vh);color:#fff;text-shadow:0 0 14px var(--pc,#7B2FFF)}
  #iText{font-size:min(21px,5.4vh);line-height:1.35;font-weight:600;color:#e6f3ff;max-width:470px}
  #iIcons{display:flex;gap:12px}
  #iIcons canvas{width:min(62px,15vh);height:min(62px,15vh);border-radius:16px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15)}
  #sIntro .big{align-self:center}
  #sItem{background:rgba(6,9,32,.8);display:grid;place-items:center}
  .card{pointer-events:auto;display:grid;grid-template-columns:auto 1fr;gap:4px 22px;align-items:center;max-width:min(680px,88vw);
    background:rgba(20,26,74,.97);border:3px solid rgba(240,171,252,.7);border-radius:28px;padding:18px 24px;box-shadow:0 0 40px rgba(123,47,255,.6)}
  .card canvas{grid-row:1/4;width:min(130px,30vh);height:min(130px,30vh)}
  #itTitle{font-weight:800;font-size:min(28px,7vh)}
  #itText{font-size:min(20px,5vh);line-height:1.35;font-weight:600;color:#e6f3ff}
  .card .row{justify-content:space-between;gap:20px;margin-top:6px}
  .know{display:flex;align-items:center;gap:10px;font-weight:700;font-size:min(19px,5vh);color:#cfe9ff;cursor:pointer;pointer-events:auto}
  .know input{width:28px;height:28px;accent-color:#22D3EE;margin:0}
  .card .mid{width:min(70px,17vh);height:min(70px,17vh)}
  #toast{position:fixed;z-index:7;left:50%;top:calc(10px + var(--st));transform:translate(-50%,-140%);max-width:min(560px,62vw);
    background:rgba(20,26,74,.94);border:2px solid rgba(34,211,238,.6);border-radius:18px;padding:9px 16px;font-weight:700;font-size:min(19px,5vh);
    line-height:1.3;text-align:center;pointer-events:none;transition:transform .35s ease;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  #toast.on{transform:translate(-50%,0)}
  #noVoice{position:absolute;left:50%;bottom:calc(8px + var(--sb));transform:translateX(-50%);font-size:13px;color:#ffd3a1;text-align:center;max-width:80vw}
  .it{pointer-events:auto;cursor:pointer}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="sa"></div>

<div id="rotate">
  <svg viewBox="0 0 60 100"><rect x="5" y="4" width="50" height="92" rx="10" fill="none" stroke="#a6f2ff" stroke-width="5"/><circle cx="30" cy="84" r="4.5" fill="#a6f2ff"/></svg>
  <p>Obróć telefon</p>
</div>

<div id="sTitle" class="scr hide">
  <div class="hero"></div>
  <div class="side">
    <div class="ttl">Luci<small>w kosmosie</small></div>
    <button class="big play" id="bStart" aria-label="Graj"><svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg></button>
  </div>
  <div class="corner tr"><button class="hb tgM" aria-label="Muzyka"></button><button class="hb tgS" aria-label="Dźwięk"></button></div>
  <div class="corner tl"><button class="hb" id="bSet" aria-label="Dla rodzica"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button></div>
  <div id="noVoice" class="hide">Ten telefon nie ma polskiego głosu, więc polecenia będą widoczne tylko na ekranie.</div>
</div>

<div id="sMap" class="scr hide">
  <div class="corner tl"><button class="hb" id="bToTitle" aria-label="Start"><svg viewBox="0 0 24 24"><path d="M12 3.2 2.6 10.6a1 1 0 0 0 1.2 1.6l.7-.5V20a1 1 0 0 0 1 1h4.3v-5.6h4.4V21h4.3a1 1 0 0 0 1-1v-8.3l.7.5a1 1 0 0 0 1.2-1.6z"/></svg></button>
    <button class="hb" id="bSky" aria-label="Niebo z gwiazdami"><svg viewBox="0 0 24 24"><path d="m12 2 2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg><span id="skyCount"></span></button></div>
  <div class="corner tr"><button class="hb tgM" aria-label="Muzyka"></button><button class="hb tgS" aria-label="Dźwięk"></button></div>
  <div id="planets"></div>
  <div class="mapL"><div class="hero"></div><div id="pName"></div></div>
  <div id="lvlGrid"></div>
</div>

<div id="hud" class="hide">
  <button class="hb" id="bMap" aria-label="Mapa"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
  <button class="hb" id="bHomeHud" aria-label="Ekran startowy"><svg viewBox="0 0 24 24"><path d="M12 3.2 2.6 10.6a1 1 0 0 0 1.2 1.6l.7-.5V20a1 1 0 0 0 1 1h4.3v-5.6h4.4V21h4.3a1 1 0 0 0 1-1v-8.3l.7.5a1 1 0 0 0 1.2-1.6z"/></svg></button>
  <div id="lvDots"></div>
  <div id="sf"></div>
  <div id="items"></div>
</div>
<div id="pad" class="hide">

<script>
(() => {
'use strict';
/* ================= ustawienia ================= */
const NAME = 'Teodor', NICK = 'Teo', NAME_VOC = 'Teodorze';

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[(Math.random() * a.length) | 0];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const approach = (x, to, rate, dt) => x + (to - x) * (1 - Math.exp(-rate * dt));
const smooth = t => t * t * (3 - 2 * t);
const $ = id => document.getElementById(id);
const $$ = s => Array.from(document.querySelectorAll(s));
const pl = (n, one, few, many) => {
  if (n === 1) return one;
  const d = n % 10, dd = n % 100;
  return (d >= 2 && d <= 4 && !(dd >= 12 && dd <= 14)) ? few : many;
};
function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

const PLANETS = [
  { id: 'ocean', name: 'Ocean', say: 'Ocean', helmet: false, music: 'ocean',
    bg: ['#16205a', '#0B0F2E', '#060920'], floor: 'rgba(22,30,86,0.62)', wall: ['#22D3EE', '#9B6BFF'], glow: '#7B2FFF',
    pc: '#22D3EE', planet: ['#5CC8FF', '#1E3A8A'], amb: 'bubble' },
  { id: 'dino', name: 'Planeta Dinozaurów', say: 'Planetę Dinozaurów', helmet: true, music: 'dino',
    bg: ['#17432c', '#0c2619', '#06140d'], floor: 'rgba(16,64,36,0.62)', wall: ['#D9F99D', '#4ADE80'], glow: '#F97316',
    pc: '#A3E635', planet: ['#9BE38F', '#2E7D4F'], amb: 'firefly' },
  { id: 'ice', name: 'Lodowa Planeta', say: 'Lodową Planetę', helmet: true, music: 'ice',
    bg: ['#1b4677', '#0d2347', '#071430'], floor: 'rgba(34,72,128,0.55)', wall: ['#FFFFFF', '#7DD3FC'], glow: '#38BDF8',
    pc: '#7DD3FC', planet: ['#E6F7FF', '#4F95C4'], amb: 'snow' },
  { id: 'mush', name: 'Grzybowa Planeta', say: 'Grzybową Planetę', helmet: true, music: 'mush',
    bg: ['#40125a', '#240a36', '#12051c'], floor: 'rgba(76,18,90,0.58)', wall: ['#FDA4AF', '#F472B6'], glow: '#C026D3',
    pc: '#F472B6', planet: ['#F9A8D4', '#7E22CE'], amb: 'spore' },
  { id: 'castle', name: 'Gwiezdny Zamek', say: 'Gwiezdny Zamek', helmet: true, music: 'castle',
    bg: ['#22104a', '#140a30', '#07051a'], floor: 'rgba(44,22,92,0.62)', wall: ['#FDE68A', '#C084FC'], glow: '#A855F7',
    pc: '#FDE68A', planet: ['#c4b5fd', '#4c1d95'], amb: 'space' },
];
const MAIN_PLANETS = 4;

// planeta, kolumny, wiersze, grupy wrogów, opcje
// R – robot, RR – dwa roboty tuż po sobie, D – dinozaur wychodzący z jaskini, P – dinozaur spacerujący po głównej drodze
const GEN_BY_P = ['bt', 'gt6', 'gt3', 'gt3'];
const LV = (p, c, r, groups, o = {}) => ({ p, c, r, groups, sleep: o.sleep ?? [4.2, 3.9, 3.6, 3.3][p], awake: o.awake ?? [2.4, 2.6, 2.8, 3.0][p],
  bonus: o.bonus || null, loops: o.loops || 0, gen: GEN_BY_P[p] });
const LEVELS = [
  LV(0, 5, 3, []), LV(0, 6, 4, []), LV(0, 7, 4, ['R']), LV(0, 7, 5, ['R', 'R']), LV(0, 8, 5, ['RR']), LV(0, 9, 5, ['R', 'RR']),
  LV(1, 7, 4, ['D'], { bonus: 'pearl' }), LV(1, 8, 5, ['D', 'R']), LV(1, 8, 5, ['D', 'D']), LV(1, 9, 5, ['P']), LV(1, 9, 6, ['R', 'D', 'D']), LV(1, 10, 6, ['RR', 'P'], { bonus: 'pearl' }),
  LV(2, 8, 5, ['D', 'R'], { bonus: 'ink' }), LV(2, 9, 5, ['RR', 'D']), LV(2, 9, 6, ['P', 'R']), LV(2, 10, 6, ['RR', 'P'], { bonus: 'ink' }), LV(2, 10, 6, ['D', 'RR', 'D']), LV(2, 11, 6, ['P', 'RR', 'D'], { bonus: 'pearl' }),
  LV(3, 9, 5, ['R', 'P'], { loops: 2 }), LV(3, 9, 6, ['RR', 'D'], { loops: 2 }), LV(3, 10, 6, ['P', 'RR'], { loops: 2, bonus: 'ink' }),
  LV(3, 10, 6, ['D', 'P', 'R'], { loops: 3 }), LV(3, 11, 6, ['RR', 'P', 'D'], { loops: 3, bonus: 'pearl' }), LV(3, 12, 6, ['P', 'RR', 'P'], { loops: 2, bonus: 'ink' }),
];
const BOSS = LEVELS.length;   // poziom z bossem ma numer 24 i jest poza listą zwykłych poziomów
const BOSS_LV = { p: 4, c: 12, r: 7, groups: [], sleep: 3.2, awake: 3.0, loops: 3, gen: 'gt3', boss: true };
const levelCfg = i => i === BOSS ? BOSS_LV : LEVELS[i];
const MAX_STARS = LEVELS.length * 3;
const PER_PLANET = 6;

const STEP = 0.18;            // sekundy na przepłynięcie jednej kratki
const HINT_AFTER = [10, 14, 18, 22, 25];   // podpowiedź po tylu sekundach bez postępu, zależnie od planety
const WARN = 1.0;             // robot mruga tyle sekund przed pobudką
const DINO_SPEED = 0.75;      // kratki na sekundę (Luci: ok. 5,5)
const DINO_PAUSE_J = 0.45;    // postój dinozaura na skrzyżowaniu
const DINO_PAUSE_NEST = 1.7;  // postój w jaskini
const DINO_PAUSE_PATROL = 1.0; // postój dinozaura spacerującego po drodze
const CAMO_TIME = 5;
const STUN_TIME = 5;

/* ---------- zapis postępu ---------- */
const SKEY = 'luci-kosmos-v1';
const save = (() => {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) {}
  if (!s || typeof s !== 'object') s = {};
  if (!s.stars || typeof s.stars !== 'object') s.stars = {};
  if (!s.seen || typeof s.seen !== 'object') s.seen = {};
  if (!s.know || typeof s.know !== 'object') s.know = {};
  if (typeof s.music !== 'boolean') s.music = true;
  if (typeof s.sound !== 'boolean') s.sound = true;
  return s;
})();
function persist() { try { localStorage.setItem(SKEY, JSON.stringify(save)); } catch (e) {} }
const isDone = i => save.stars[i] != null;
const isUnlocked = i => i === 0 || isDone(i - 1);
function firstOpenLevel() { for (let i = 0; i < LEVELS.length; i++) if (!isDone(i)) return i; return LEVELS.length - 1; }
const starsOf = i => save.stars[i] == null ? 0 : save.stars[i];
function totalStars() { let n = 0; for (let i = 0; i < LEVELS.length; i++) n += starsOf(i); return n; }
const allLevelsDone = () => LEVELS.every((_, i) => isDone(i));
function missingIn(p) { let n = 0; for (let k = 0; k < PER_PLANET; k++) n += 3 - starsOf(p * PER_PLANET + k); return n; }
function resetProgress() { save.stars = {}; save.seen = {}; save.know = {}; save.bossDone = false; save.reachedSky = false; persist(); }

/* ================= dźwięki (generowane w przeglądarce) ================= */
const Snd = {
  ctx: null, out: null, sfx: null, mus: null, nb: null, waves: {},
  init() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      const c = this.ctx;
      this.out = c.createGain(); this.out.gain.value = 0.85;
      const comp = c.createDynamicsCompressor();
      this.out.connect(comp); comp.connect(c.destination);
      this.sfx = c.createGain(); this.sfx.gain.value = 1; this.sfx.connect(this.out);
      this.mus = c.createGain(); this.mus.gain.value = 0;
      this.musF = c.createBiquadFilter(); this.musF.type = 'lowpass'; this.musF.frequency.value = 12000; this.musF.Q.value = 0.5;
      this.mus.connect(this.musF); this.musF.connect(this.out);
      try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) {}
      Music.boot();
    }
    if (this.ctx.state !== 'running') { try { this.ctx.resume(); } catch (e) {} }
  },
  ok() { return this.ctx && save.sound && this.ctx.state === 'running'; },
  pulse(duty) {
    if (this.waves[duty]) return this.waves[duty];
    const n = 40, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) { re[k] = Math.sin(TAU * k * duty) / (Math.PI * k); im[k] = (1 - Math.cos(TAU * k * duty)) / (Math.PI * k); }
    return (this.waves[duty] = this.ctx.createPeriodicWave(re, im));
  },
  osc(type, f, t) {
    const o = this.ctx.createOscillator();
    if (typeof type === 'number') o.setPeriodicWave(this.pulse(type)); else o.type = type;
    o.frequency.setValueAtTime(f, t);
    return o;
  },
  tone(f, dur, o = {}) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const osc = this.osc(o.type || 'sine', f, t), g = c.createGain();
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + (o.att || 0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.sfx);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  noiseBuf() {
    if (!this.nb) {
      const c = this.ctx, n = (c.sampleRate * 0.6) | 0;
      this.nb = c.createBuffer(1, n, c.sampleRate);
      const d = this.nb.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    return this.nb;
  },
  rawNoise(dest, t, dur, o) {
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf(); s.loop = true;
    const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass';
    f.frequency.setValueAtTime(o.freq || 1500, t);
    if (o.fto) f.frequency.exponentialRampToValueAtTime(o.fto, t + dur);
    f.Q.value = o.q || 1;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.1, t + (o.att || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest);
    s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.05);
  },
  noise(dur, o = {}) { if (this.ok()) this.rawNoise(this.sfx, this.ctx.currentTime + (o.delay || 0), dur, o); },

  blop() { const f = rand(320, 470); this.tone(f, 0.14, { vol: 0.14, to: f * 2.2, att: 0.004 }); },
  thud() { this.tone(130, 0.1, { vol: 0.12, to: 70 }); },
  star() {
    [988, 1319, 1760].forEach((f, k) => this.tone(f, 0.3, { type: 'triangle', vol: 0.17, delay: k * 0.07 }));
    this.tone(2637, 0.45, { vol: 0.05, delay: 0.2 });
  },
  bzzt() {
    this.tone(150, 0.24, { type: 'square', vol: 0.06, to: 90 });
    this.tone(880, 0.09, { type: 'square', vol: 0.045, delay: 0.26 });
    this.tone(587, 0.14, { type: 'square', vol: 0.045, delay: 0.37 });
  },
  roar() {
    this.tone(260, 0.5, { type: 'sawtooth', vol: 0.05, to: 120, att: 0.04 });
    this.tone(196, 0.45, { type: 'square', vol: 0.03, to: 98, att: 0.04, delay: 0.02 });
    this.noise(0.4, { ft: 'lowpass', freq: 900, vol: 0.07, att: 0.04 });
  },
  wake() { this.tone(523, 0.08, { type: 'square', vol: 0.03 }); this.tone(784, 0.11, { type: 'square', vol: 0.03, delay: 0.1 }); },
  yawn() { this.tone(620, 0.5, { vol: 0.06, to: 250, att: 0.05 }); },
  shh() { this.noise(0.45, { ft: 'highpass', freq: 3200, q: 0.7, vol: 0.05, att: 0.06 }); },
  chime() { this.tone(1568, 0.5, { vol: 0.07 }); this.tone(2093, 0.55, { vol: 0.05, delay: 0.13 }); },
  giggle() { [700, 880, 760, 990].forEach((f, k) => this.tone(f, 0.09, { vol: 0.1, to: f * 1.3, delay: k * 0.08 })); },
  tap() { this.tone(660, 0.08, { type: 'triangle', vol: 0.12, to: 990 }); },
  ink() { this.noise(0.32, { ft: 'lowpass', freq: 2600, fto: 260, vol: 0.14, att: 0.005 }); this.tone(320, 0.2, { vol: 0.12, to: 90, delay: 0.02 }); },
  dizzy() { this.tone(900, 0.6, { vol: 0.05, to: 420 }); this.tone(1100, 0.5, { vol: 0.03, to: 500, delay: 0.1 }); },
  pearl() { [0, 4, 7, 12, 16, 19, 24].forEach((s, k) => this.tone(659 * Math.pow(2, s / 12), 0.28, { type: 'triangle', vol: 0.08, delay: k * 0.045 })); },
  inkPick() { this.tone(220, 0.14, { vol: 0.15, to: 440 }); this.tone(330, 0.16, { vol: 0.1, to: 660, delay: 0.09 }); },
  camoEnd() { [24, 19, 12, 7, 0].forEach((s, k) => this.tone(523 * Math.pow(2, s / 12), 0.18, { type: 'triangle', vol: 0.05, delay: k * 0.05 })); },
  correct() { [784, 988, 1319, 1568].forEach((f, k) => this.tone(f, 0.32, { type: 'triangle', vol: 0.16, delay: k * 0.08 })); },
  wrong() { this.tone(330, 0.18, { type: 'triangle', vol: 0.12, to: 300 }); this.tone(262, 0.26, { type: 'triangle', vol: 0.12, to: 240, delay: 0.16 }); },
  count(k) { this.tone(440 * Math.pow(2, Math.min(k, 24) / 12), 0.13, { type: 'triangle', vol: 0.12 }); },
  knock() { this.tone(210, 0.08, { type: 'square', vol: 0.05 }); this.tone(210, 0.08, { type: 'square', vol: 0.05, delay: 0.16 }); },
  rocket() { this.noise(2.8, { ft: 'bandpass', freq: 260, fto: 2200, q: 0.7, vol: 0.09, att: 0.5 }); },
  win() {
    [523, 659, 784, 1047].forEach((f, k) => this.tone(f, k === 3 ? 0.75 : 0.22, { type: 'triangle', vol: 0.2, delay: k * 0.13 }));
    [1319, 1568].forEach((f, k) => this.tone(f, 0.7, { vol: 0.06, delay: 0.52 + k * 0.03 }));
  },
  fanfare() {
    const n = [[523, 0, .15], [523, .16, .15], [523, .32, .15], [659, .48, .3], [784, .8, .15], [659, .96, .15], [784, 1.12, .3], [1047, 1.44, .9]];
    n.forEach(([f, d, l]) => this.tone(f, l, { type: 'triangle', vol: 0.2, delay: d }));
    [1319, 1568, 2093].forEach((f, k) => this.tone(f, 1.0, { vol: 0.05, delay: 1.44 + k * 0.04 }));
  },
};

/* ================= głos (synteza mowy telefonu) ================= */
const Voice = {
  v: null, id: 0, _t: null, _d: null, noPl: false,
  pickVoice() {
    try {
      const all = speechSynthesis.getVoices(), vs = all.filter(v => /^pl/i.test(v.lang));
      this.v = vs.find(v => /zosia|ewa|paulina|maja|agnieszka|google/i.test(v.name)) || vs[0] || null;
      this.noPl = all.length > 0 && !vs.length;
      const n = document.getElementById('noVoice'); if (n) n.classList.toggle('hide', !this.noPl);
    } catch (e) {}
  },
  say(text, delay = 0) {
    if (!save.sound || !('speechSynthesis' in window) || !text) return;
    clearTimeout(this._t);
    const go = () => {
      try {
        speechSynthesis.cancel();
        const id = ++this.id;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'pl-PL';
        if (this.v) u.voice = this.v;
        u.rate = 0.95; u.pitch = 1.15; u.volume = 1;

const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

function chordOf(name) {
  const m = /^([A-G])([#b]?)(m?)$/.exec(name);
  return { root: NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0), tones: m[3] ? [0, 3, 7] : [0, 4, 7] };
}
function parseTrack(def) {
  const ev = {}; let s = 0;
  for (const tok of def.mel.trim().split(/\s+/)) {
    const i = tok.lastIndexOf('-'), n = tok.slice(0, i), len = +tok.slice(i + 1);
    if (n !== 'r') (ev[s] = ev[s] || []).push({ n: nm(n), len });
    s += len;
  }
  return Object.assign({ chords: def.chords.map(chordOf), ev, len: s }, STYLES[def.style]);
}

const Music = {
  name: null, cur: null, step: 0, next: 0, ducked: false, timer: null, echoIn: null, delay: null, lastF: 0,
  boot() {
    if (this.timer) return;
    const c = Snd.ctx;
    this.echoIn = c.createGain(); this.echoIn.gain.value = 0;
    this.delay = c.createDelay(1.5); this.delay.delayTime.value = 0.3;
    const fb = c.createGain(); fb.gain.value = 0.38;
    const tone = c.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 3500;
    this.echoIn.connect(this.delay); this.delay.connect(tone); tone.connect(fb); fb.connect(this.delay); tone.connect(Snd.mus);
    this.timer = setInterval(() => this.tick(), 30);
    this.apply();
    if (this.cur) this.restart();
  },
  play(name) {
    if (this.name === name) return;
    this.name = name; this.cur = TRACKS[name];
    this.restart();
  },
  restart() {
    const c = Snd.ctx; if (!c || !this.cur) return;
    this.step = 0; this.next = c.currentTime + 0.08; this.lastF = 0;
    const tr = this.cur, sd = 60 / tr.bpm / 4;
    if (this.delay) {
      this.delay.delayTime.setTargetAtTime(Math.min(1.4, sd * 3), c.currentTime, 0.05);
      this.echoIn.gain.setTargetAtTime(tr.echo || 0, c.currentTime, 0.05);
    }
    Snd.musF.frequency.setTargetAtTime(tr.cutoff || 12000, c.currentTime, 0.1);
  },
  apply() {
    const c = Snd.ctx; if (!c) return;
    const v = !save.music ? 0 : (this.ducked ? 0.14 : 0.42);
    Snd.mus.gain.setTargetAtTime(v, c.currentTime, 0.08);
  },
  duck(on) { if (this.ducked !== on) { this.ducked = on; this.apply(); } },
  tick() {
    const c = Snd.ctx;
    if (!c || !this.cur || !save.music || c.state !== 'running') return;
    const tr = this.cur, sd = 60 / tr.bpm / 4;
    if (this.next < c.currentTime - 0.1) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.15) {
      const sw = (tr.swing && (this.step & 1)) ? tr.swing * sd : 0;
      this.playStep(this.step, this.next + sw, sd);
      this.step = (this.step + 1) % tr.len;
      this.next += sd;
    }
  },
  note(type, f, t, dur, vol, o = {}) {
    const c = Snd.ctx, osc = Snd.osc(type, o.from || f, t), g = c.createGain();
    if (o.from) osc.frequency.exponentialRampToValueAtTime(f, t + 0.06);
    if (o.vib) {
      const lfo = c.createOscillator(), lg = c.createGain();
      lfo.frequency.value = 5.5; lg.gain.value = f * (Math.pow(2, o.vib / 1200) - 1);
      lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t + 0.08); lfo.stop(t + dur + 0.05);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (o.att || 0.006));
    g.gain.exponentialRampToValueAtTime(vol * (o.sus ?? 0.55), t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(Snd.mus);
    if (o.echo && this.echoIn) g.connect(this.echoIn);
    osc.start(t); osc.stop(t + dur + 0.03);
  },
  drum(kind, t) {

    const thump = (f0, f1, len, vol) => {
      const o = Snd.osc('sine', f0, t), g = c.createGain();
      o.frequency.exponentialRampToValueAtTime(f1, t + len * 0.8);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g); g.connect(Snd.mus); o.start(t); o.stop(t + len + 0.02);
    };
    if (kind === 'kick') thump(150, 50, 0.14, 0.3);
    else if (kind === 'softkick') thump(120, 55, 0.18, 0.16);
    else if (kind === 'tomLo') thump(130, 75, 0.22, 0.22);
    else if (kind === 'tomHi') thump(200, 120, 0.16, 0.18);
    else if (kind === 'wood') thump(1100, 700, 0.05, 0.12);
    else if (kind === 'wood2') thump(800, 520, 0.05, 0.1);
    else if (kind === 'snare') Snd.rawNoise(Snd.mus, t, 0.12, { ft: 'bandpass', freq: 1900, q: 0.8, vol: 0.09, att: 0.002 });
    else if (kind === 'hat') Snd.rawNoise(Snd.mus, t, 0.035, { ft: 'highpass', freq: 7500, q: 0.7, vol: 0.03, att: 0.002 });
    else if (kind === 'shaker') Snd.rawNoise(Snd.mus, t, 0.07, { ft: 'bandpass', freq: 5200, q: 1.2, vol: 0.025, att: 0.01 });
  },
  playStep(s, t, sd) {
    const tr = this.cur, bar = (s >> 4) % tr.chords.length, pos = s & 15, ch = tr.chords[bar];
    // melodia
    const ev = tr.ev[s];
    if (ev) for (const e of ev) {
      const f = mf(e.n), dur = e.len * sd * (tr.gap || 0.9);
      if (tr.lead === 'bell') {
        this.note('sine', f, t, dur, tr.leadVol, { echo: true, sus: 0.3, att: 0.003 });
        this.note('sine', f * 2, t, dur * 0.5, tr.leadVol * 0.25, { sus: 0.2, att: 0.003 });
      } else {
        this.note(tr.lead, f, t, dur, tr.leadVol, { echo: true, vib: tr.vib, from: tr.slide && this.lastF ? this.lastF : 0 });
      }
      this.lastF = f;
    }
    // arpeggio
    if (tr.arp && pos % (tr.arp.every || 1) === 0) {
      const k = tr.arp.pat[(pos / (tr.arp.every || 1)) % tr.arp.pat.length];
      const an = 12 * (tr.arp.oct + 1) + ch.root + (k === 3 ? 12 : ch.tones[k]);
      this.note(tr.arp.wave, mf(an), t, sd * 0.75 * (tr.arp.every || 1), tr.arp.vol);
    }
    // bas
    const b = tr.bass, root = 36 + ch.root;
    if (b.pat === 'drive' && pos % 2 === 0) this.note(b.wave, mf(root + (pos % 4 === 2 ? 12 : 0)), t, sd * 1.6, b.vol);
    else if (b.pat === 'walk' && pos % 4 === 0) this.note(b.wave, mf(root + 12 + [0, 7, 12, 7][pos / 4]), t, sd * 3.6, b.vol);
    else if (b.pat === 'long' && pos === 0) this.note(b.wave, mf(root + 12), t, sd * 15, b.vol, { sus: 0.7 });
    else if (b.pat === 'oompah') {
      if (pos % 8 === 0) this.note(b.wave, mf(root + (pos === 8 ? 7 : 0)), t, sd * 2, b.vol);
      if (pos % 8 === 4) for (const tn of ch.tones) this.note(0.25, mf(48 + ch.root + tn), t, sd * 1.2, 0.025);
    }
    // perkusja
    const d = tr.drums;
    if (d === 'soft') { if (pos === 0 || pos === 8) this.drum('softkick', t); if (pos % 4 === 2) this.drum('shaker', t); }
    else if (d === 'tribal') {
      if (pos === 0 || pos === 6 || pos === 8) this.drum('kick', t);
      if (pos === 3 || pos === 11) this.drum('tomLo', t);
      if (pos === 10 || pos === 14) this.drum('tomHi', t);
      if (pos === 4 || pos === 12) this.drum('snare', t);
    }
    else if (d === 'hats') { if (pos % 4 === 2) this.drum('hat', t); }
    else if (d === 'wood') { if (pos === 0 || pos === 8) this.drum('softkick', t); if (pos === 2 || pos === 6 || pos === 10) this.drum('wood', t); if (pos === 13) this.drum('wood2', t); }
  },
};

/* ================= labirynt i budowa poziomu ================= */
const DIRS = [
  { dx: 0, dy: -1, bit: 1, opp: 4 },
  { dx: 1, dy: 0, bit: 2, opp: 8 },
  { dx: 0, dy: 1, bit: 4, opp: 1 },
  { dx: -1, dy: 0, bit: 8, opp: 2 },
];
// rosnące drzewo: 'bt' daje długie, kręte korytarze (łatwo), 'prim' dużo krótkich ślepych uliczek (trudniej)
function genMaze(c, r, algo = 'bt') {
  const M = new Uint8Array(c * r).fill(15), seen = new Uint8Array(c * r);
  const p = { bt: 1, gt6: 0.6, gt3: 0.3, prim: 0 }[algo] ?? 1;
  const list = [0]; seen[0] = 1;
  while (list.length) {
    const li = Math.random() < p ? list.length - 1 : (Math.random() * list.length) | 0;
    const i = list[li], x = i % c, y = (i / c) | 0, opts = [];
    for (const d of DIRS) {
      const nx = x + d.dx, ny = y + d.dy;
      if (nx >= 0 && ny >= 0 && nx < c && ny < r && !seen[ny * c + nx]) opts.push(d);
    }
    if (!opts.length) { list.splice(li, 1); continue; }
    const d = pick(opts), j = (y + d.dy) * c + x + d.dx;
    M[i] &= ~d.bit; M[j] &= ~d.opp; seen[j] = 1; list.push(j);
  }
  return M;
}
// pętle: otwiera kilka ścian między daleko połączonymi miejscami, żeby powstały dwie drogi
function addLoops(M, c, r, n) {

      const ag = g.createLinearGradient(0, y0, 0, y0 + H * 0.15);
      ag.addColorStop(0, b % 2 ? 'rgba(34,211,238,0.16)' : 'rgba(74,222,128,0.16)'); ag.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = ag; g.fill();
    }
    g.fillStyle = '#1d4f80';
    g.beginPath(); g.moveTo(0, H);
    let x = 0; while (x < W) { const w = 40 + rnd() * 70, h = H * (0.1 + rnd() * 0.16); g.lineTo(x + w / 2, H - h); g.lineTo(x + w, H - H * 0.04); x += w; }
    g.lineTo(W, H); g.closePath(); g.fill();
  } else if (kind === 'mush') {
    stars(70, 0.7, 0.6);
    for (let k = 0; k < 6; k++) {
      const x = W * (0.05 + 0.18 * k + rnd() * 0.05), s = H * (0.12 + rnd() * 0.12);
      g.fillStyle = '#2a0b3d'; roundRect(g, x - s * 0.12, H - s * 1.1, s * 0.24, s * 1.2, s * 0.08); g.fill();
      const cg = g.createRadialGradient(x, H - s * 1.1, 0, x, H - s * 1.1, s * 0.8);
      cg.addColorStop(0, 'rgba(244,114,182,0.35)'); cg.addColorStop(1, 'rgba(244,114,182,0)');
      g.fillStyle = cg; g.beginPath(); g.arc(x, H - s * 1.1, s * 0.8, 0, TAU); g.fill();
      g.fillStyle = '#4a1466'; g.beginPath(); g.ellipse(x, H - s * 1.1, s * 0.55, s * 0.35, 0, Math.PI, 0); g.fill();
      g.fillStyle = 'rgba(255,190,230,0.35)';
      for (let d = 0; d < 4; d++) { g.beginPath(); g.arc(x - s * 0.3 + d * s * 0.2, H - s * 1.1 - s * (0.1 + (d % 2) * 0.12), s * 0.05, 0, TAU); g.fill(); }
    }
  }
}

/* ---------- drobinki w tle (bąbelki, świetliki, śnieg, zarodniki) ---------- */
let ambKind = null;
const amb = [];
function setAmb(kind) {
  if (ambKind === kind) return;
  ambKind = kind; amb.length = 0;
  for (let k = 0; k < 34; k++) amb.push({ x: rand(0, W), y: rand(0, H), r: rand(1.2, 4.5), v: rand(10, 32), ph: rand(0, TAU), a: rand(0.15, 0.45) });
}
function updAmb(dt) {
  for (const b of amb) {
    if (ambKind === 'snow') { b.y += b.v * 0.9 * dt; b.x += Math.sin(T + b.ph) * 0.3; if (b.y > H + 6) { b.y = -6; b.x = rand(0, W); } }
    else if (ambKind === 'firefly') { b.x += Math.cos(T * 0.5 + b.ph) * 12 * dt; b.y += Math.sin(T * 0.7 + b.ph) * 10 * dt; }
    else if (ambKind === 'space') { /* migoczą w miejscu */ }
    else { b.y -= b.v * (ambKind === 'spore' ? 0.4 : 1) * dt; b.x += Math.sin(T * 0.8 + b.ph) * 0.25; if (b.y < -8) { b.y = H + 8; b.x = rand(0, W); } }
  }
}
function drawAmb() {
  for (const b of amb) {
    if (ambKind === 'bubble') { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.strokeStyle = `rgba(180,225,255,${b.a})`; ctx.lineWidth = 1; ctx.stroke(); }
    else if (ambKind === 'firefly') { const a = 0.3 + 0.7 * Math.max(0, Math.sin(T * 2 + b.ph)); ctx.fillStyle = `rgba(220,255,120,${a * 0.8})`; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.6, 0, TAU); ctx.fill(); }
    else if (ambKind === 'snow') { ctx.fillStyle = `rgba(255,255,255,${b.a + 0.2})`; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.7, 0, TAU); ctx.fill(); }
    else if (ambKind === 'spore') { ctx.fillStyle = `rgba(255,170,220,${b.a})`; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.8, 0, TAU); ctx.fill(); }
    else if (ambKind === 'space') { const a = 0.3 + 0.7 * Math.abs(Math.sin(T * 1.3 + b.ph)); sparkle(ctx, b.x, b.y, b.r * 0.9, `rgba(255,255,255,${a * 0.7})`); }
  }
}

/* ---------- labirynt (rysowany raz, potem tylko kopiowany) ---------- */
function renderMaze() {
  const cs = L.cell, pad = Math.ceil(cs * 0.4), P = L.P;
  const w = L.c * cs + pad * 2, h = L.r * cs + pad * 2;
  L.pad = pad; L.mw = w; L.mh = h;
  mz.width = Math.round(w * DPR); mz.height = Math.round(h * DPR);
  const g = mz.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, w, h);
  g.translate(pad, pad);
  roundRect(g, -cs * 0.06, -cs * 0.06, L.c * cs + cs * 0.12, L.r * cs + cs * 0.12, cs * 0.22);
  g.fillStyle = P.floor; g.fill();
  const rnd = seeded(7 + L.idx);
  g.fillStyle = 'rgba(255,255,255,0.05)';
  for (let k = 0; k < L.c * L.r * 4; k++) { g.beginPath(); g.arc(rnd() * L.c * cs, rnd() * L.r * cs, 0.8 + rnd() * 1.6, 0, TAU); g.fill(); }
  // start
  const sx = (L.start % L.c + 0.5) * cs, sy = (((L.start / L.c) | 0) + 0.5) * cs;
  g.beginPath(); g.arc(sx, sy, cs * 0.36, 0, TAU);
  g.fillStyle = 'rgba(123,47,255,0.16)'; g.fill();
  g.setLineDash([cs * 0.06, cs * 0.07]); g.lineWidth = Math.max(1.5, cs * 0.025); g.strokeStyle = 'rgba(200,170,255,0.5)'; g.stroke(); g.setLineDash([]);
  // ściany
  g.beginPath();
  const mids = [];
  for (let y = 0; y < L.r; y++) for (let x = 0; x < L.c; x++) {
    const i = y * L.c + x, b = L.M[i], X = x * cs, Y = y * cs;
    if (b & 1) { g.moveTo(X, Y); g.lineTo(X + cs, Y); mids.push([X + cs / 2, Y]); }
    if (b & 8) { g.moveTo(X, Y); g.lineTo(X, Y + cs); mids.push([X, Y + cs / 2]); }
    if (y === L.r - 1 && (b & 4)) { g.moveTo(X, Y + cs); g.lineTo(X + cs, Y + cs); mids.push([X + cs / 2, Y + cs]); }
    if (x === L.c - 1 && (b & 2)) { g.moveTo(X + cs, Y); g.lineTo(X + cs, Y + cs); mids.push([X + cs, Y + cs / 2]); }
  }
  const lw = Math.max(6, cs * 0.17);
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.shadowColor = P.glow; g.shadowBlur = cs * 0.35;
  g.strokeStyle = hexA(P.glow, 0.55); g.lineWidth = lw * 1.75; g.stroke();
  g.shadowColor = P.wall[0]; g.shadowBlur = cs * 0.15;
  const gr = g.createLinearGradient(0, 0, L.c * cs, L.r * cs);
  gr.addColorStop(0, P.wall[0]); gr.addColorStop(1, P.wall[1]);
  g.strokeStyle = gr; g.lineWidth = lw; g.stroke();
  g.shadowBlur = 0;
  g.strokeStyle = 'rgba(255,255,255,0.4)'; g.lineWidth = lw * 0.28; g.stroke();
  if (P.id === 'mush') {
    g.fillStyle = 'rgba(255,255,255,0.85)';
    for (const [mx, my] of mids) { g.beginPath(); g.arc(mx, my, lw * 0.22, 0, TAU); g.fill(); }
  } else if (P.id === 'dino') {
    g.fillStyle = '#16a34a';
    for (const [mx, my] of mids) { if (rnd() < 0.5) { g.beginPath(); g.ellipse(mx, my - lw * 0.3, lw * 0.35, lw * 0.18, rnd() * 3, 0, TAU); g.fill(); } }
  } else if (P.id === 'ice') {
    for (const [mx, my] of mids) if (rnd() < 0.35) sparkle(g, mx, my, lw * 0.45, 'rgba(255,255,255,0.9)');
  }
  // jaskinie dinozaurów wykute w ścianie na końcu ich korytarza (nie da się ich zebrać)
  for (const d of L.dinos) {
    if (d.kind !== 'D') continue;
    const e = d.seg[d.m], pr = d.seg[d.m - 1];
    const ex = e % L.c, ey = (e / L.c) | 0, dx = ex - pr % L.c, dy = ey - ((pr / L.c) | 0);
    const cx = (ex + 0.5 + dx * 0.5) * cs, cy = (ey + 0.5 + dy * 0.5) * cs;
    g.save(); g.translate(cx, cy); g.rotate(Math.atan2(-dy, -dx) - Math.PI / 2);
    // kamienna obwódka
    g.fillStyle = '#5c4433';
    g.beginPath(); g.ellipse(0, 0, cs * 0.36, cs * 0.3, 0, Math.PI, 0); g.lineTo(cs * 0.36, cs * 0.05); g.lineTo(-cs * 0.36, cs * 0.05); g.closePath(); g.fill();
    const rr = seeded(e + 3);
    g.fillStyle = '#7a5c44';
    for (let k = 0; k < 7; k++) { const a = Math.PI + (k + 0.5) / 7 * Math.PI; g.beginPath(); g.arc(Math.cos(a) * cs * 0.3, Math.sin(a) * cs * 0.25, cs * (0.05 + rr() * 0.03), 0, TAU); g.fill(); }
    // ciemne wnętrze
    const ig = g.createRadialGradient(0, 0, 0, 0, 0, cs * 0.26);
    ig.addColorStop(0, '#05030a'); ig.addColorStop(1, '#22170f');
    g.fillStyle = ig;
    g.beginPath(); g.ellipse(0, 0, cs * 0.24, cs * 0.2, 0, Math.PI, 0); g.lineTo(cs * 0.24, cs * 0.05); g.lineTo(-cs * 0.24, cs * 0.05); g.closePath(); g.fill();
    g.restore();
  }
}

/* ---------- Luci ---------- */
function drawLuci(g, x, y, s, st) {
  const R = s * 0.5, skin = '#6516D9', t = st.time ?? T;
  g.save();
  g.translate(x, y - R * 0.02);
  if (st.alpha != null) g.globalAlpha = st.alpha;
  g.rotate(st.tilt || 0);
  const sq = st.squash || 0;
  g.scale(1 + sq * 0.13, 1 - sq * 0.13);
  if (!st.noGlow) {
    const glow = g.createRadialGradient(0, 0, R * 0.2, 0, 0, R * 1.35);
    glow.addColorStop(0, 'rgba(180,76,255,0.42)'); glow.addColorStop(1, 'rgba(180,76,255,0)');
    g.fillStyle = glow; g.beginPath(); g.arc(0, 0, R * 1.35, 0, TAU); g.fill();
  }
  // macki
  g.lineCap = 'round';
  const n = 6, segs = 7, segLen = R * 0.15;
  for (let k = 0; k < n; k++) {
    const u = (k / (n - 1)) * 2 - 1;
    let px = u * R * 0.48, py = R * 0.26, a = Math.PI / 2 + u * 0.95;
    for (let j = 0; j < segs; j++) {
      const w = lerp(R * 0.28, R * 0.065, j / (segs - 1));
      a += Math.sin(t * 3.4 + k * 1.3 + j * 0.65) * 0.2 + u * 0.07;
      const nx = px + Math.cos(a) * segLen, ny = py + Math.sin(a) * segLen;
      g.beginPath(); g.moveTo(px, py); g.lineTo(nx, ny);
      g.lineWidth = w; g.strokeStyle = skin; g.stroke();
      if (j % 2 === 1 && j < segs - 1) { g.beginPath(); g.arc(nx, ny, w * 0.2, 0, TAU); g.fillStyle = '#F0369F'; g.fill(); }
      px = nx; py = ny;
    }
  }
  g.beginPath(); g.ellipse(0, R * 0.3, R * 0.56, R * 0.2, 0, 0, TAU); g.fillStyle = '#5512c0'; g.fill();
  // głowa
  const hy = -R * 0.18, hrx = R * 0.62, hry = R * 0.66;
  const rg = g.createRadialGradient(-R * 0.25, hy - R * 0.35, R * 0.08, 0, hy, R * 0.85);
  rg.addColorStop(0, '#C77DFF'); rg.addColorStop(0.45, '#7B2FFF'); rg.addColorStop(1, '#4A0FB0');
  g.fillStyle = rg;
  g.beginPath(); g.ellipse(0, hy, hrx, hry, 0, 0, TAU); g.fill();
  g.lineWidth = R * 0.055;
  g.beginPath(); g.ellipse(0, hy, hrx, hry, 0, -0.9, 0.7); g.strokeStyle = 'rgba(61,227,240,0.85)'; g.stroke();
  g.beginPath(); g.ellipse(0, hy, hrx, hry, 0, Math.PI - 0.7, Math.PI + 0.9); g.strokeStyle = 'rgba(240,54,159,0.75)'; g.stroke();
  g.beginPath(); g.ellipse(-R * 0.22, hy - R * 0.38, R * 0.17, R * 0.09, -0.5, 0, TAU); g.fillStyle = 'rgba(255,255,255,0.35)'; g.fill();
  g.fillStyle = 'rgba(240,54,159,0.45)';
  [[0.28, -0.55, 0.06], [0.38, -0.36, 0.04], [0.12, -0.68, 0.035]].forEach(([a, b, r]) => { g.beginPath(); g.arc(a * R, hy + b * R + R * 0.18, r * R, 0, TAU); g.fill(); });
  // twarz
  const mood = st.mood || 'idle';
  const ey = hy + R * 0.1, ex = R * 0.25, er = R * 0.19;
  const ink = '#1d0638';
  for (const sx of [-1, 1]) {
    g.save(); g.translate(sx * ex, ey);
    if (mood === 'happy') {
      g.beginPath(); g.arc(0, er * 0.35, er * 0.7, Math.PI + 0.35, -0.35);
      g.lineWidth = er * 0.32; g.strokeStyle = ink; g.stroke();
    } else {
      const open = mood === 'angry' ? 0.75 : Math.max(0.08, st.blink ?? 1);
      g.scale(1, open);
      g.beginPath(); g.ellipse(0, 0, er, er * 1.12, 0, 0, TAU); g.fillStyle = '#fff'; g.fill();
      let lx = clamp(st.lookX || 0, -1, 1) * er * 0.36, ly = clamp(st.lookY || 0, -1, 1) * er * 0.36;
      if (mood === 'sad') { lx = 0; ly = er * 0.32; }
      if (mood === 'surprised' || mood === 'angry') { lx = 0; ly = 0; }
      const pupil = (mood === 'surprised' || mood === 'oops') ? 0.24 : 0.34;
      g.beginPath(); g.arc(lx, ly, er * 0.62, 0, TAU); g.fillStyle = '#22D3EE'; g.fill();
      g.beginPath(); g.arc(lx, ly, er * pupil, 0, TAU); g.fillStyle = '#0B0F2E'; g.fill();
      g.beginPath(); g.arc(lx - er * 0.18, ly - er * 0.22, er * 0.15, 0, TAU); g.fillStyle = '#fff'; g.fill();
    }
    g.restore();
    // brwi
    g.strokeStyle = ink; g.lineWidth = R * 0.05; g.lineCap = 'round';
    if (mood === 'sad') { g.beginPath(); g.moveTo(sx * (ex + er * 0.9), ey - er * 1.3); g.lineTo(sx * (ex - er * 0.7), ey - er * 1.75); g.stroke(); }
    else if (mood === 'angry') { g.beginPath(); g.moveTo(sx * (ex + er * 0.95), ey - er * 1.55); g.lineTo(sx * (ex - er * 0.6), ey - er * 1.0); g.stroke(); }
    else if (mood === 'surprised') { g.beginPath(); g.arc(sx * ex, ey - er * 1.25, er * 0.75, Math.PI + 0.6, -0.6); g.stroke(); }
  }
  // policzki
  const cheekA = mood === 'angry' ? 0.85 : 0.55, cheekS = mood === 'spit' ? 1.6 : 1;
  g.fillStyle = mood === 'angry' ? `rgba(255,60,90,${cheekA})` : `rgba(240,54,159,${cheekA})`;
  for (const sx of [-1, 1]) { g.beginPath(); g.ellipse(sx * R * 0.43, ey + R * 0.2, R * 0.09 * cheekS, R * 0.055 * cheekS, 0, 0, TAU); g.fill(); }
  // buzia
  const my = ey + R * 0.3;
  g.fillStyle = '#2a0a4a'; g.strokeStyle = '#2a0a4a'; g.lineWidth = R * 0.05; g.lineCap = 'round';
  if (mood === 'happy') {
    g.beginPath(); g.moveTo(-R * 0.15, my - R * 0.03); g.quadraticCurveTo(0, my + R * 0.24, R * 0.15, my - R * 0.03); g.closePath(); g.fill();
    g.beginPath(); g.ellipse(0, my + R * 0.07, R * 0.06, R * 0.035, 0, 0, TAU); g.fillStyle = '#F0369F'; g.fill();
  } else if (mood === 'oops' || mood === 'surprised' || mood === 'spit') {
    g.beginPath(); g.ellipse(0, my + R * 0.02, R * (mood === 'spit' ? 0.05 : 0.065), R * (mood === 'spit' ? 0.05 : 0.09), 0, 0, TAU); g.fill();
  } else if (mood === 'sad') {
    g.beginPath(); g.arc(0, my + R * 0.1, R * 0.12, Math.PI + 0.45, -0.45); g.stroke();
    g.fillStyle = '#7DD3FC'; g.beginPath(); g.ellipse(-ex - er * 0.2, ey + er * 1.5, R * 0.04, R * 0.065, 0, 0, TAU); g.fill();
  } else if (mood === 'angry') {
    g.beginPath(); g.arc(0, my + R * 0.12, R * 0.12, Math.PI + 0.6, -0.6); g.stroke();
  } else {
    g.beginPath(); g.arc(0, my - R * 0.06, R * 0.1, 0.25, Math.PI - 0.25); g.stroke();
  }
  // korona
  if (st.crown) {
    g.save(); g.translate(0, hy - hry * 0.92);
    const cw = R * 0.5, ch = R * 0.32;
    g.beginPath();
    g.moveTo(-cw, 0); g.lineTo(-cw, -ch * 0.7); g.lineTo(-cw * 0.5, -ch * 0.25); g.lineTo(0, -ch); g.lineTo(cw * 0.5, -ch * 0.25); g.lineTo(cw, -ch * 0.7); g.lineTo(cw, 0); g.closePath();
    g.fillStyle = '#FFC93C'; g.fill(); g.lineWidth = R * 0.035; g.strokeStyle = '#E09400'; g.lineJoin = 'round'; g.stroke();
    [[-cw * 0.55, -ch * 0.2, '#22D3EE'], [0, -ch * 0.3, '#F0369F'], [cw * 0.55, -ch * 0.2, '#22D3EE']].forEach(([a, b, c]) => { g.beginPath(); g.arc(a, b, R * 0.055, 0, TAU); g.fillStyle = c; g.fill(); });
    g.restore();
  }
  // hełm-bańka na obcych planetach
  if (st.helmet) {
    const hr = R * 0.86, hcy = hy + R * 0.02;
    g.beginPath(); g.arc(0, hcy, hr, 0, TAU);
    g.fillStyle = 'rgba(170,230,255,0.10)'; g.fill();
    g.lineWidth = R * 0.035; g.strokeStyle = 'rgba(190,240,255,0.7)'; g.stroke();
    g.beginPath(); g.arc(0, hcy, hr * 0.82, -2.5, -1.7); g.lineWidth = R * 0.06; g.strokeStyle = 'rgba(255,255,255,0.55)'; g.stroke();
    g.beginPath(); g.ellipse(0, hcy + hr * 0.93, hr * 0.42, hr * 0.1, 0, 0, TAU); g.fillStyle = 'rgba(190,240,255,0.55)'; g.fill();
  }
  g.restore();
}

/* ---------- robot ---------- */
function dizzyStars(g, x, y, s) {
  for (let k = 0; k < 3; k++) {
    const a = T * 4 + k * TAU / 3;
    sparkle(g, x + Math.cos(a) * s * 0.22, y + Math.sin(a) * s * 0.07, s * 0.07, '#FFD84D');
  }
}
function inkSplat(g, x, y, s, seed) {
  const rnd = seeded(Math.floor(seed * 1000) + 3);
  g.fillStyle = 'rgba(25,15,60,0.92)';
  for (let k = 0; k < 6; k++) { g.beginPath(); g.arc(x + (rnd() - 0.5) * s * 0.3, y + (rnd() - 0.5) * s * 0.18, s * (0.04 + rnd() * 0.07), 0, TAU); g.fill(); }
  g.fillStyle = 'rgba(160,140,255,0.5)'; g.beginPath(); g.arc(x - s * 0.05, y - s * 0.04, s * 0.025, 0, TAU); g.fill();
}
function drawRobot(g, x, y, s, rb) {
  const stun = rb.stunT > 0, st = stun ? 'stun' : rb.state;
  g.save(); g.translate(x, y);
  if (st === 'awake') {
    const p = 0.5 + 0.5 * Math.sin(T * 8);
    g.beginPath(); g.arc(0, 0, s * 0.46, 0, TAU);
    g.fillStyle = `rgba(255,70,100,${0.15 + 0.08 * p})`; g.fill();
    g.lineWidth = s * 0.04; g.strokeStyle = `rgba(255,90,120,${0.5 + 0.3 * p})`; g.stroke();
  } else if (st === 'warn') {
    g.beginPath(); g.arc(0, 0, s * 0.46, 0, TAU);
    g.fillStyle = 'rgba(255,200,60,0.1)'; g.fill();
    g.setLineDash([s * 0.08, s * 0.08]); g.lineWidth = s * 0.03; g.strokeStyle = 'rgba(255,210,80,0.65)'; g.stroke(); g.setLineDash([]);
  }
  const shake = rb.alertT > 0 ? Math.sin(T * 55) * s * 0.035 : 0;
  const bob = (st === 'sleep' || stun) ? Math.sin(T * 1.8 + rb.seed) * s * 0.012 : Math.sin(T * 7 + rb.seed) * s * 0.01;
  g.translate(shake, bob);
  if (stun) g.rotate(Math.sin(T * 3) * 0.12);
  const bw = s * 0.56, bt = -s * 0.2, bh = s * 0.46;
  g.fillStyle = '#2b3550';
  roundRect(g, -bw * 0.4, bt + bh - s * 0.02, bw * 0.28, s * 0.1, s * 0.04); g.fill();
  roundRect(g, bw * 0.12, bt + bh - s * 0.02, bw * 0.28, s * 0.1, s * 0.04); g.fill();
  g.lineCap = 'round'; g.lineWidth = s * 0.06; g.strokeStyle = rb.col[1];
  for (const sx of [-1, 1]) {
    const ay = st === 'awake' ? -s * 0.1 + Math.sin(T * 9 + sx) * s * 0.04 : s * 0.07;
    g.beginPath(); g.moveTo(sx * bw * 0.5, bt + bh * 0.55); g.lineTo(sx * (bw * 0.5 + s * 0.09), bt + bh * 0.55 + ay); g.stroke();
  }
  const bg = g.createLinearGradient(0, bt, 0, bt + bh);
  bg.addColorStop(0, rb.col[0]); bg.addColorStop(1, rb.col[1]);
  roundRect(g, -bw / 2, bt, bw, bh, s * 0.1); g.fillStyle = bg; g.fill();

/* ---------- cząsteczki ---------- */
const parts = [];
function spawn(p) { if (parts.length < 500) parts.push(p); }
function burstBubbles(x, y, n, sz) {
  for (let k = 0; k < n; k++) spawn({ k: 'b', x: x + rand(-sz, sz), y: y + rand(-sz, sz) * 0.5, vx: rand(-12, 12), vy: rand(-55, -25), r: rand(2, 4.5), life: rand(0.6, 1.1), max: 1.1 });
}
function burstSparks(x, y, n, sz, cols) {
  for (let k = 0; k < n; k++) { const a = rand(0, TAU), v = rand(60, 200) * sz / 60; spawn({ k: 's', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 120, r: rand(3, 7) * sz / 60, life: rand(0.5, 0.9), max: 0.9, col: pick(cols) }); }
}
function burstInk(x, y, tx, ty, sz) {
  for (let k = 0; k < 14; k++) {
    const f = rand(0.6, 1.3);
    spawn({ k: 'i', x, y, vx: (tx - x) * 2.4 * f + rand(-30, 30), vy: (ty - y) * 2.4 * f + rand(-30, 30), g: 0, r: rand(2.5, 6) * sz / 50, life: rand(0.35, 0.6), max: 0.6 });
  }
}
function confetti(n) {
  const cols = ['#22D3EE', '#7B2FFF', '#F0369F', '#FFB547', '#ffffff', '#B44CFF'];
  for (let k = 0; k < n; k++) spawn({ k: 'c', x: rand(0, W), y: rand(-H * 0.3, -10), vx: rand(-30, 30), vy: rand(60, 160), g: 40, r: rand(4, 8), rot: rand(0, TAU), vr: rand(-6, 6), life: rand(2.5, 4), max: 4, col: pick(cols), wob: rand(2, 5), ph: rand(0, 6) });
}
function updParts(dt) {
  for (let k = parts.length - 1; k >= 0; k--) {
    const p = parts[k];
    p.life -= dt;
    if (p.life <= 0 || p.y > H + 40) { parts.splice(k, 1); continue; }
    p.vy += (p.g || 0) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.rot != null) p.rot += p.vr * dt;
    if (p.wob) p.x += Math.sin(p.life * p.wob + p.ph) * 0.6;

}
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = Math.min(1, (p.life / p.max) * 2);
    if (p.k === 'b') { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.strokeStyle = 'rgba(200,240,255,0.85)'; ctx.lineWidth = 1.3; ctx.stroke(); }
    else if (p.k === 's') sparkle(ctx, p.x, p.y, p.r, p.col);
    else if (p.k === 'i') { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fillStyle = '#1e1450'; ctx.fill(); }
    else if (p.k === 'c') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.fillRect(-p.r, -p.r * 0.45, p.r * 2, p.r * 0.9); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
}

/* ================= rozgrywka ================= */
let L = null;
let scene = 'title';
let target = null, padDir = null;
const ptr = { down: false, id: null };
const luci = { i: 0, from: 0, to: 0, t: 1, moving: false, prev: null, dir: null, squash: 0, bumpT: 0, bumpDir: null, oopsT: 0,
  happyT: 0, spitT: 0, blink: 1, blinkT: 2, lookX: 0, lookY: 0.3, x: 0, y: 0, camoT: 0, ink: 0, wobT: 0, wobDir: null };

function cellXY(i) { return { x: L.ox + (i % L.c + 0.5) * L.cell, y: L.oy + (((i / L.c) | 0) + 0.5) * L.cell }; }
// dinozaur zajmuje to pole, na którym jest większa część jego ciała
function dinoCells(d) { return [d.seg[clamp(Math.round(d.p), 0, d.m)]]; }
function dinoPos(d) {
  const a = Math.floor(d.p), b = Math.min(d.m, a + 1), f = d.p - a;
  const A = cellXY(d.seg[a]), B = cellXY(d.seg[b]);
  return { x: lerp(A.x, B.x, f), y: lerp(A.y, B.y, f) };
}
const isRobot = e => e.seg === undefined;
const luciCell = () => luci.moving ? luci.to : luci.i;

function blockerAt(j) {
  for (const g of L.gates) if (!g.open && g.i === j) return g;
  if (L.boss && !L.boss.defeated && L.boss.i === j) return L.boss;
  if (luci.camoT > 0) return null;
  for (const rb of L.robots) if (rb.i === j && rb.state === 'awake' && rb.stunT <= 0) return rb;
  for (const d of L.dinos) if (d.stunT <= 0 && dinoCells(d).includes(j)) return d;
  return null;
}
function occupied(j) {
  for (const rb of L.robots) if (rb.i === j && rb.state === 'awake' && rb.stunT <= 0) return true;
  for (const d of L.dinos) if (d.stunT <= 0 && dinoCells(d).includes(j)) return true;
  return false;
}
function dirBetween(a, b) {
  const dx = (b % L.c) - (a % L.c), dy = ((b / L.c) | 0) - ((a / L.c) | 0);
  return DIRS.find(d => d.dx === dx && d.dy === dy) || null;
}

function startLevelState() {
  Object.assign(luci, { i: L.start, from: L.start, to: L.start, t: 1, moving: false, prev: null, dir: null, squash: 0, bumpT: 0, oopsT: 0,
    happyT: 0, spitT: 0, camoT: 0, ink: 0, wobT: 0 });
  target = null; padDir = null; ptr.down = false; ptr.id = null;
}

/* ---------- kierunek ruchu: strzałki albo palec na labiryncie ---------- */
function wantedDir() {
  if (padDir != null) { padPending = null; return { d: DIRS[padDir], pad: true }; }
  if (padPending != null) { const d = padPending; padPending = null; return { d: DIRS[d], pad: true }; }
  if (!target) return null;
  const cx = luci.i % L.c + 0.5, cy = ((luci.i / L.c) | 0) + 0.5;
  const vx = target.x - cx, vy = target.y - cy, len = Math.hypot(vx, vy);
  if (len < 0.45) { if (!ptr.down) target = null; return null; }
  let best = null, bs = 0.36;
  for (const d of DIRS) {
    if (L.M[luci.i] & d.bit) continue;
    const sc = (d.dx * vx + d.dy * vy) / len;
    if (sc > bs) { bs = sc; best = d; }
  }
  if (!best) { if (!ptr.down) target = null; return null; }
  return { d: best, pad: false };
}

function tryStep() {
  const w = wantedDir();
  if (!w) return;
  const d = w.d;
  if (L.M[luci.i] & d.bit) {
    if (luci.wobT <= 0) { luci.wobT = 0.35; luci.wobDir = d; Snd.thud(); }
    return;
  }
  const j = luci.i + d.dy * L.c + d.dx;
  const en = blockerAt(j);
  if (en) {
    if (en.k != null && en.open != null) { gateBump(en, d); return; }
    if (en === L.boss) { bossBump(d); return; }
    if (luci.ink > 0 && !L.isBoss) spitInk(en); else bump(en, d);
    return;
  }
  luci.from = luci.i; luci.to = j; luci.t = 0; luci.moving = true; luci.dir = d; luci.squash = 1;
  Snd.blop();
  if (L.P.id === 'ocean') burstBubbles(luci.x, luci.y + L.cell * 0.2, 2, L.cell * 0.15);
}

function enemyXY(en) { return isRobot(en) ? cellXY(en.i) : dinoPos(en); }
function spitInk(en) {
  luci.ink--; luci.spitT = 0.5; luci.oopsT = 0;
  en.stunT = STUN_TIME; en.alertT = 0;
  if (!isRobot(en)) en.state = 'pause';
  const e = enemyXY(en);
  burstInk(luci.x, luci.y, e.x, e.y, L.cell);
  Snd.ink(); setTimeout(() => Snd.dizzy(), 300);
  updateItemsHud();
}
function bump(en, d) {
  luci.bumpT = 0.55; luci.bumpDir = d; luci.oopsT = 0.9;
  en.alertT = 0.7;
  if (L.time - en.lastBz > 1.1) { isRobot(en) ? Snd.bzzt() : Snd.roar(); en.lastBz = L.time; }
  if (L.time - L.bumpVoice > 9) { L.bumpVoice = L.time; sayShow(pick(isRobot(en) ? SAY.bumpRobot : SAY.bumpDino), 450); }
  if (!ptr.down) target = null;
}
function pushBack() {
  if (luci.moving) {
    const f = luci.from; luci.from = luci.to; luci.to = f; luci.t = 1 - luci.t;
    luci.dir = dirBetween(luci.from, luci.to);
  } else {
    let back = luci.prev;
    if (back == null || occupied(back)) back = nbrs(L.M, L.c, luci.i).find(j => !occupied(j)) ?? null;
    if (back == null) return false;
    luci.from = luci.i; luci.to = back; luci.t = 0; luci.moving = true; luci.dir = dirBetween(luci.i, back);

}
function robotWoke(rb) {

  if (luci.ink > 0 && !L.isBoss) { spitInk(rb); return; }
  if (pushBack()) { rb.alertT = 0.7; Snd.bzzt(); rb.lastBz = L.time; }
}

function updateRobots(dt) {
  const lc = luciCell();
  for (const rb of L.robots) {
    const st = robotStateAt(rb, L.time);
    if (st !== rb.state) {
      const prev = rb.state; rb.state = st;
      const near = Math.abs(lc % L.c - rb.i % L.c) + Math.abs(((lc / L.c) | 0) - ((rb.i / L.c) | 0)) <= 3;
      if (st === 'awake') { robotWoke(rb); if (near && rb.stunT <= 0) Snd.wake(); }
      else if (st === 'sleep' && prev === 'awake' && near && rb.stunT <= 0) Snd.yawn();
    }
    if (rb.alertT > 0) rb.alertT -= dt;
    if (rb.stunT > 0) { rb.stunT -= dt; if (rb.stunT <= 0 && rb.state === 'awake' && lc === rb.i) rb.stunT = 0.3; }
  }
}
function updateDinos(dt) {
  const lc = luciCell();
  for (const d of L.dinos) {
    if (d.alertT > 0) d.alertT -= dt;
    if (d.stunT > 0) { d.stunT -= dt; if (d.stunT <= 0 && dinoCells(d).includes(lc)) d.stunT = 0.3; continue; }
    const before = dinoPos(d).x;
    if (d.state === 'pause') {
      d.pauseT -= dt;
      if (d.pauseT <= 0) { d.state = 'walk'; d.dir *= -1; }
    } else {
      d.p += d.dir * DINO_SPEED * dt; d.walkPh += DINO_SPEED * dt * 2;
      const patrol = d.kind === 'P';
      if (d.p >= d.m) { d.p = d.m; d.state = 'pause'; d.pauseT = patrol ? DINO_PAUSE_PATROL : DINO_PAUSE_NEST; }
      else if (d.p <= 0) { d.p = 0; d.state = 'pause'; d.pauseT = patrol ? DINO_PAUSE_PATROL : DINO_PAUSE_J; }
    }
    const dx = dinoPos(d).x - before;
    if (Math.abs(dx) > 0.01) d.face = dx > 0 ? 1 : -1;
    // dinozaur wchodzi na pole Luci
    if (luci.camoT <= 0 && dinoCells(d).includes(luciCell())) {
      if (luci.ink > 0 && !L.isBoss) spitInk(d);
      else if (pushBack()) { d.alertT = 0.8; if (L.time - d.lastBz > 1.1) { Snd.roar(); d.lastBz = L.time; } }
    }
  }
}

function arrive(i) {
  const p = cellXY(i);
  for (const s of L.stars) if (!s.got && s.i === i) {
    s.got = true; s.t = 0;
    Snd.star(); luci.happyT = 0.7;
    burstSparks(p.x, p.y, 16, L.cell, ['#FFD27A', '#FFB547', '#fff', '#22D3EE']);
    buildStarsHud(true);
  }
  for (const it of L.items) if (!it.got && it.i === i) {
    it.got = true; it.t = 0; luci.happyT = 0.8;
    if (it.kind === 'pearl') { Snd.pearl(); burstSparks(p.x, p.y, 20, L.cell, ['#ff7eb6', '#ffd36e', '#7dffb2', '#6ecbff', '#c38bff']); }
    else { luci.ink++; Snd.inkPick(); burstSparks(p.x, p.y, 12, L.cell, ['#8b7bff', '#c4b5fd', '#fff']); updateItemsHud(); }
    if (save.know[it.kind]) { activateItem(it.kind); Voice.say(pick(SAY[it.kind]), 150); toast(ITEM_INFO[it.kind].title + '!', 1800); }
    else showItemInfo(it.kind, true);
  }

    sayShow(['Pierwszy kryształowy klucz! Otworzy pierwszą bramę.', 'Drugi klucz! Płyń do drugiej bramy.', 'Trzeci klucz! Ostatnia brama czeka.'][k.k]);

}

/* ---------- Gwiezdny Zamek ---------- */
function gateBump(g, d) {
  const key = L.keys.find(k => k.k === g.k);
  if (key && key.got) {
    g.open = true; g.t = 0; Snd.correct();
    const p = cellXY(g.i); burstSparks(p.x, p.y, 30, L.cell, [g.col, '#fff', '#FDE68A']);
    sayShow('Brama otwarta!');
    return;
  }
  luci.bumpT = 0.55; luci.bumpDir = d; luci.oopsT = 0.6;
  if (L.time - L.bumpVoice > 6) { L.bumpVoice = L.time; Snd.thud(); sayShow('Brama jest zamknięta. Znajdź kryształowy klucz w tym samym kolorze!', 300); }
  if (!ptr.down) target = null;
}
function bossBump(d) {
  const b = L.boss;
  if (b.stunT > 0) { luci.bumpT = 0.4; luci.bumpDir = d; return; }
  if (b.state !== 'awake' && luci.ink > 0) { hitBoss(); return; }
  luci.bumpT = 0.55; luci.bumpDir = d; luci.oopsT = 0.9; b.alertT = 0.8;
  if (L.time - b.lastBz > 1.1) { Snd.bzzt(); Snd.roar(); b.lastBz = L.time; }
  if (L.time - L.bumpVoice > 7) {
    L.bumpVoice = L.time;
    sayShow(luci.ink > 0 ? 'Strażnik nie śpi! Poczekaj, aż zaśnie, i wtedy plujesz atramentem.' : 'Potrzebujesz kropli atramentu, żeby oszołomić Strażnika!', 300);
  }
  if (!ptr.down) target = null;
}
function hitBoss() {
  const b = L.boss;
  luci.ink--; luci.spitT = 0.5; b.hits++; b.stunT = 2.6; b.alertT = 0;
  const e = cellXY(b.i);
  burstInk(luci.x, luci.y, e.x, e.y, L.cell); Snd.ink(); setTimeout(() => Snd.dizzy(), 300);
  updateItemsHud();
  if (b.hits >= 3) {
    b.defeated = true; b.deadT = 0;
    setTimeout(() => { Snd.fanfare(); burstSparks(e.x, e.y, 60, L.cell * 1.6, ['#FDE68A', '#fff', '#C084FC', '#22D3EE']); confetti(60); }, 500);
    sayShow('Udało się! Strażnik zasnął na dobre. Płyń do Gwiazdy Przyjaźni!', 700);
  } else sayShow(b.hits === 1 ? 'Trafiony! Jeszcze dwa razy.' : 'Trafiony! Jeszcze raz!', 400);
}
function updateBoss(dt) {
  const b = L.boss; if (!b) return;
  if (b.defeated) { b.deadT += dt; return; }
  if (b.alertT > 0) b.alertT -= dt;
  if (b.stunT > 0) { b.stunT -= dt; b.t = 0; b.state = 'sleep'; return; }
  b.t += dt;
  const sl = BOSS_SLEEP[b.hits], aw = BOSS_AWAKE[b.hits], ph = b.t % (sl + aw);
  const st = ph < sl ? (ph > sl - 1 ? 'warn' : 'sleep') : 'awake';
  if (st !== b.state) {
    b.state = st;
    if (st === 'awake') {
      Snd.wake();
      // przebudzony Strażnik odpycha Luci, jeśli stoi tuż przy nim
      if (nbrs(L.M, L.c, b.i).includes(luciCell()) && luci.camoT <= 0 && luci.i !== L.goal) { if (pushBack()) { b.alertT = 0.8; Snd.bzzt(); } }
    }
  }
}
function reachStar() {
  L.phase = 'ending'; L.phaseT = 0; luci.happyT = 99; target = null;
  Snd.fanfare(); confetti(140);
  const p = cellXY(L.goal); burstSparks(p.x, p.y, 50, L.cell * 1.5, ['#FDE68A', '#fff', '#F472B6', '#22D3EE']);
}

function updateLuci(dt) {
  if (luci.bumpT > 0) luci.bumpT -= dt;
  if (luci.oopsT > 0) luci.oopsT -= dt;
  if (luci.happyT > 0) luci.happyT -= dt;
  if (luci.spitT > 0) luci.spitT -= dt;
  if (luci.wobT > 0) luci.wobT -= dt;
  if (luci.camoT > 0) {
    luci.camoT -= dt;
    if (luci.camoT <= 0) {
      if (occupied(luciCell())) luci.camoT = 0.25;
      else { luci.camoT = 0; Snd.camoEnd(); updateItemsHud(); }
    }
  }
  luci.squash = approach(luci.squash, 0, 9, dt);
  if (luci.moving) {
    luci.t += dt / STEP;
    if (luci.t >= 1) {
      luci.t = 1; luci.moving = false;
      luci.prev = luci.from; luci.i = luci.to;
      arrive(luci.i);
    }
  }
  if (!luci.moving && luci.bumpT <= 0 && L.phase === 'play') tryStep();
  let x, y;
  if (luci.moving) {
    const a = cellXY(luci.from), b = cellXY(luci.to), e = 0.55 * smooth(luci.t) + 0.45 * luci.t;
    x = lerp(a.x, b.x, e); y = lerp(a.y, b.y, e);
  } else { const a = cellXY(luci.i); x = a.x; y = a.y; }
  if (luci.bumpT > 0 && luci.bumpDir) {
    const k = Math.sin((1 - luci.bumpT / 0.55) * Math.PI) * L.cell * 0.3;
    x += luci.bumpDir.dx * k; y += luci.bumpDir.dy * k;
  }
  if (luci.wobT > 0 && luci.wobDir) {
    const k = Math.sin((1 - luci.wobT / 0.35) * Math.PI) * L.cell * 0.08;
    x += luci.wobDir.dx * k; y += luci.wobDir.dy * k;
  }
  luci.x = x; luci.y = y;
  let lx = Math.sin(T * 0.7) * 0.5, ly = 0.25;
  if (luci.moving && luci.dir) { lx = luci.dir.dx; ly = luci.dir.dy; }
  else if (padDir != null) { lx = DIRS[padDir].dx; ly = DIRS[padDir].dy; }
  else if (target) {
    const vx = target.x - (luci.i % L.c + 0.5), vy = target.y - (((luci.i / L.c) | 0) + 0.5), n = Math.hypot(vx, vy) || 1;
    lx = vx / n; ly = vy / n;
  }
  luci.lookX = approach(luci.lookX, lx, 12, dt); luci.lookY = approach(luci.lookY, ly, 12, dt);
}
function updBlink(dt) {
  luci.blinkT -= dt;
  if (luci.blinkT <= 0) { luci.blink = 0.1; luci.blinkT = rand(2, 5); }
  luci.blink = approach(luci.blink, 1, 14, dt);
}

function updatePlay(dt) {
  if (L.phase === 'play') {
    L.time += dt;
    updateRobots(dt);
    updateDinos(dt);
    updateBoss(dt);
    if (!L.hint && L.time - L.lastProg > HINT_AFTER[L.cfg.p]) { L.hint = true; Snd.chime(); }
  }
  updateLuci(dt);
  L.phaseT += dt;
  if (L.phase === 'chest' && L.phaseT > 0.9) openTask();
  if (L.phase === 'open' && L.phaseT > 1.9) showWin();
  for (const g of L.gates) if (g.open) g.t += dt;
  for (const k of L.keys) if (k.got) k.t += dt;
  if (L.phase === 'ending' && L.phaseT > 2.2) { L.phase = 'done'; showThanks(); return; }
  for (const s of L.stars) if (s.got) s.t += dt;
  for (const it of L.items) if (it.got) it.t += dt;

/* ---------- rysowanie poziomu ---------- */
function drawPlay() {
  ctx.drawImage(mz, L.ox - L.pad, L.oy - L.pad, L.mw, L.mh);
  const cs = L.cell;
  if (L.hint && L.phase === 'play') {
    let i = luci.i;
    for (let k = 0; k < 4; k++) {
      const nx = nbrs(L.M, L.c, i).find(j => L.goalDist[j] === L.goalDist[i] - 1);
      if (nx == null) break;
      const p = cellXY(nx), q = 0.5 + 0.5 * Math.sin(T * 5 - k * 0.9);
      ctx.beginPath(); ctx.arc(p.x, p.y, cs * (0.08 + 0.05 * q), 0, TAU);
      ctx.fillStyle = `rgba(34,211,238,${(0.85 - k * 0.17) * (0.45 + 0.55 * q)})`; ctx.fill();
      i = nx;
    }
  }
  const g = cellXY(L.goal);
  const opened = L.phase === 'open' || L.phase === 'done';
  if (L.isBoss) drawFriendStar(ctx, g.x, g.y, cs, L.phase === 'ending' || L.phase === 'done');
  else drawChest(ctx, g.x, g.y, cs, opened, opened ? null : TASK_BADGE[L.task], L.phase === 'chest' || scene === 'task');
  for (const gt of L.gates) { if (!gt.open || gt.t < 0.6) { const p = cellXY(gt.i); drawGate(ctx, p.x, p.y, cs, gt); } }
  for (const k of L.keys) {
    const p = cellXY(k.i);
    if (!k.got) drawKey(ctx, p.x, p.y, cs, k.col, k.k);
    else if (k.t < 0.45) { ctx.save(); ctx.globalAlpha = 1 - k.t / 0.45; drawKey(ctx, p.x, p.y - k.t * cs, cs * (1 + k.t * 2), k.col, k.k); ctx.restore(); }
  }
  if (L.boss) { const p = cellXY(L.boss.i); drawBoss(ctx, p.x, p.y, cs, L.boss); }
  for (const s of L.stars) {
    const p = cellXY(s.i);
    if (!s.got) drawStar(ctx, p.x, p.y, cs, s.seed);
    else if (s.t < 0.45) drawStar(ctx, p.x, p.y - s.t * cs * 0.8, cs, s.seed, 1 + s.t * 1.8, 1 - s.t / 0.45);
  }
  for (const it of L.items) {
    const p = cellXY(it.i);
    const fn = it.kind === 'pearl' ? drawPearl : drawInkDrop;
    if (!it.got) fn(ctx, p.x, p.y, cs, it.seed);
    else if (it.t < 0.4) { ctx.save(); ctx.globalAlpha = 1 - it.t / 0.4; fn(ctx, p.x, p.y - it.t * cs, cs * (1 + it.t * 2), it.seed); ctx.restore(); }
  }
  for (const rb of L.robots) { const p = cellXY(rb.i); drawRobot(ctx, p.x, p.y, cs, rb); }
  for (const d of L.dinos) { const p = dinoPos(d); drawDino(ctx, p.x, p.y, cs * 0.95, d); }
  // Luci
  let jy = 0;
  if (L.phase !== 'play') jy = -Math.abs(Math.sin(L.phaseT * 7)) * cs * 0.22;
  let mood = 'idle';
  if (L.phase !== 'play' || luci.happyT > 0) mood = 'happy';
  else if (luci.spitT > 0) mood = 'spit';
  else if (luci.oopsT > 0) mood = 'oops';
  const tilt = luci.moving && luci.dir ? luci.dir.dx * 0.18 : Math.sin(T * 1.3) * 0.04;
  const camo = luci.camoT > 0;
  const lx = luci.x, ly = luci.y + jy + Math.sin(T * 3) * cs * 0.025;
  drawLuci(ctx, lx, ly, cs * 0.86, {
    blink: luci.blink, lookX: luci.lookX, lookY: luci.lookY, mood, squash: luci.squash, tilt, helmet: L.P.helmet,
    alpha: camo ? 0.32 + 0.08 * Math.sin(T * 6) : null,
  });
  if (camo) {
    const n = 12, R = cs * 0.48;
    for (let k = 0; k < n; k++) {
      const a = T * 2.5 + k * TAU / n;
      ctx.fillStyle = `hsla(${(k * 30 + T * 220) % 360},100%,70%,0.85)`;
      ctx.beginPath(); ctx.arc(lx + Math.cos(a) * R, ly + Math.sin(a) * R, cs * 0.035, 0, TAU); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(lx, ly, R + cs * 0.07, -Math.PI / 2, -Math.PI / 2 + TAU * (luci.camoT / CAMO_TIME));
    ctx.lineWidth = cs * 0.04; ctx.strokeStyle = 'rgba(240,171,252,0.9)'; ctx.lineCap = 'round'; ctx.stroke();
  }
  if (luci.ink > 0 && !camo) {
    for (let k = 0; k < luci.ink; k++) drawInkDrop(ctx, lx + cs * (0.34 - k * 0.14), ly - cs * 0.36, cs * 0.45, k);
  }
}

let TK = null, solvedCount = 0;
function openTask() {
  L.phase = 'task'; L.phaseT = 0;
  const tier = L.cfg.p;
  const t = GEN[L.task](tier);
  TK = { t, tries: 0, done: false };
  const vis = $('tVis'), ans = $('tAns');
  vis.className = t.visClass || ''; vis.innerHTML = ''; ans.innerHTML = '';
  $('tQ').textContent = t.text || t.say;
  const hasVis = !!t.vis || t.optsIn === 'vis';
  vis.classList.toggle('hide', !hasVis);
  $('sTask').classList.toggle('novis', !hasVis);
  vis.style.fontSize = t.fs ? `${t.fs}px` : '';
  if (typeof t.vis === 'function') t.vis(vis); else if (t.vis) vis.innerHTML = t.vis;
  const holder = t.optsIn === 'vis' ? vis : ans;
  ans.classList.toggle('hide', t.optsIn === 'vis');
  for (const o of t.opts) {
    const b = document.createElement('button');
    b.className = 'ans ' + (o.cls || t.optCls || '');
    b.innerHTML = o.html;
    if (o.draw) o.draw(b);
    b.addEventListener('click', () => answer(b, o));
    holder.appendChild(b); o.el = b;
  }
  scene = 'task';
  $('pad').classList.add('hide'); $('hud').classList.add('hide');
  showScreen('sTask');
  padDir = null; setPadVisual(null);
  Voice.say(t.say, 300);
  if (t.memorize) {
    ans.style.visibility = 'hidden';
    const my = TK;
    setTimeout(() => {
      if (TK !== my) return;
      vis.innerHTML = t.cover; ans.style.visibility = '';
      $('tQ').textContent = t.text2; t.say = t.say2; Voice.say(t.say2);
    }, t.memorize);
  } else ans.style.visibility = '';
}
function answer(b, o) {
  if (!TK || TK.done || b.disabled) return;
  Snd.init();
  if (o.ok) {
    TK.done = true; b.classList.add('ok'); Snd.correct();
    solvedCount++;
    const named = solvedCount % 2 === 0;
    let msg = TK.t.explain || pick(SAY.correct);
    if (named) msg = pick(SAY.named) + ' ' + (TK.t.explain ? TK.t.explain.replace(/^Tak! /, '') : '');
    Voice.say(msg.trim());
    $('tQ').textContent = msg.trim();
    setTimeout(closeTask, (TK.t.explain || named) ? 2600 : 1300);
  } else {
    b.classList.add('wrong'); b.disabled = true; Snd.wrong(); TK.tries++;
    Voice.say(pick(SAY.wrong));
    if (TK.tries >= 2) { const ok = TK.t.opts.find(x => x.ok); if (ok && ok.el) ok.el.classList.add('hint'); }
  }
}
function closeTask() {
  if (scene !== 'task') return;
  TK = null;
  showScreen(null);
  scene = 'play';
  $('pad').classList.remove('hide'); $('hud').classList.remove('hide');
  chestOpen();
}

function readSafe() {
  const cs = getComputedStyle($('sa'));
  SA.t = parseFloat(cs.paddingTop) || 0; SA.r = parseFloat(cs.paddingRight) || 0;
  SA.b = parseFloat(cs.paddingBottom) || 0; SA.l = parseFloat(cs.paddingLeft) || 0;
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const k in bgCache) delete bgCache[k];
  readSafe();
  const k = ambKind; ambKind = null; if (k) setAmb(k);
  layoutPlay();
  updateHero();
}
function layoutPlay() {
  if (!L) return;
  const hud = $('hud'), pad = $('pad');
  const left = (hud.classList.contains('hide') ? 80 + SA.l : hud.getBoundingClientRect().right) + 4;
  const right = (pad.classList.contains('hide') ? W - 186 - SA.r : pad.getBoundingClientRect().left) - 10;
  const top = SA.t + 14, bottom = H - SA.b - 14;
  const aw = Math.max(100, right - left), ah = Math.max(80, bottom - top);
  const cell = Math.max(22, Math.floor(Math.min(aw / L.c, ah / L.r, 96)));
  L.cell = cell;
  L.ox = Math.round(left + (aw - cell * L.c) / 2);
  L.oy = Math.round(top + (ah - cell * L.r) / 2);
  renderMaze();
}
function updateHero() {
  const id = { title: 'sTitle', map: 'sMap', win: 'sWin', final: 'sFinal', intro: 'sIntro', thanks: 'sThanks' }[scene];
  if (!id) return;
  const r = $(id).querySelector('.hero').getBoundingClientRect();
  hero.x = r.left + r.width / 2; hero.y = r.top + r.height / 2; hero.w = r.width; hero.h = r.height;
}
function showScreen(id) {
