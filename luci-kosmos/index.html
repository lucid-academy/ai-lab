  if (!paused) {
    T += dt;
    updAmb(dt); updBlink(dt);
    heroSt.squash = approach(heroSt.squash, 0, 7, dt);
    if (heroSt.happyT > 0) heroSt.happyT -= dt;
    if (L && (scene === 'play' || scene === 'task')) updatePlay(dt);
    if (scene === 'travel' && TR) { TR.t += dt; if (TR.t > 3.6) endTravel(); }
    if ((scene === 'final' || scene === 'thanks') && Math.random() < dt * 5) confetti(3);
    if (scene === 'sky' && SKY && SKY.animate && !SKY.done) {
      const before = Math.floor(SKY.t / 0.07);
      SKY.t += dt;
      const now = Math.floor(SKY.t / 0.07);
      if (now > before && now <= SKY.order.length && now % 3 === 0) Snd.count(Math.min(24, now / 3));

pad.addEventListener('pointerdown', e => {
  e.preventDefault(); Snd.init(); keepAwake();
  padId = e.pointerId;
  try { pad.setPointerCapture(e.pointerId); } catch (_) {}
  setPad(padFromEvent(e));
});
pad.addEventListener('pointermove', e => { if (e.pointerId === padId) setPad(padFromEvent(e)); });
const padUp = e => { if (e.pointerId !== padId) return; padId = null; setPad(null); };
pad.addEventListener('pointerup', padUp);
pad.addEventListener('pointercancel', padUp);
const KEYS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 };
addEventListener('keydown', e => {
  if (!(e.key in KEYS) || scene !== 'play') return;
  e.preventDefault(); Snd.init();
  setPad(KEYS[e.key]);
});
addEventListener('keyup', e => { if (e.key in KEYS && padDir === KEYS[e.key]) setPad(null); });

function toCell(e) { return { x: (e.clientX - L.ox) / L.cell, y: (e.clientY - L.oy) / L.cell }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); Snd.init();
  if (scene === 'map' && Math.hypot(e.clientX - hero.x, e.clientY - hero.y) < Math.min(hero.w, hero.h) * 0.4) {
    userStart(); Snd.tap(); const p = mapPlanet; showIntro(p, () => startLevel(firstOpenIn(p), true)); return;
  }
  if (scene === 'sky' && SKY && SKY.done) {
    const b = skyBoxes().findIndex(b => e.clientX >= b.x && e.clientX <= b.x + b.s && e.clientY >= b.y && e.clientY <= b.y + b.s + 24);
    if (b >= 0) { Snd.tap(); goMap(b); }
    return;
  }
  if (scene === 'title') {
    if (Math.hypot(e.clientX - hero.x, e.clientY - hero.y) < hero.size * 0.5) {
      heroSt.squash = 1; heroSt.happyT = 0.9; Snd.giggle(); burstBubbles(e.clientX, e.clientY, 6, 20);
    }
    return;
  }
  if (scene !== 'play' || !L || L.phase !== 'play') return;
  ptr.down = true; ptr.id = e.pointerId; padPending = null;
  target = toCell(e);
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (scene === 'title') {
    const dx = e.clientX - hero.x, dy = e.clientY - hero.y, n = Math.hypot(dx, dy) || 1;
    heroSt.lookX = dx / n; heroSt.lookY = dy / n; return;
  }
  if (!ptr.down || e.pointerId !== ptr.id || !L) return;
  target = toCell(e);
});
const release = e => { if (e.pointerId !== ptr.id) return; ptr.down = false; ptr.id = null; };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
$('sTravel').addEventListener('pointerdown', () => { if (TR && TR.t > 0.6) endTravel(); });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('resize', () => { resize(); settleSize(); });
addEventListener('orientationchange', settleSize);
document.addEventListener('fullscreenchange', settleSize);
if (window.visualViewport) visualViewport.addEventListener('resize', settleSize);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Voice.stop(); try { Snd.ctx && Snd.ctx.suspend(); } catch (e) {} }
  else { try { Snd.ctx && Snd.ctx.resume(); } catch (e) {} if (scene !== 'title') keepAwake(); }
});

$('bStart').addEventListener('click', () => {
  userStart(); goFull(); Snd.tap();
  goMap();
  Voice.say(SAY.start, 200);
});
$('bToTitle').addEventListener('click', () => { Snd.tap(); goTitle(); });
$('bMap').addEventListener('click', () => { Snd.tap(); goMap(L ? L.cfg.p : null); });
$('bWinNext').addEventListener('click', () => {
  userStart(); Snd.tap();
  const n = L.idx + 1;
  if (n >= BOSS) { goSky(true); return; }
  if (LEVELS[n].p !== L.cfg.p) travel(LEVELS[n].p, () => startLevel(n)); else startLevel(n);
});
$('bHomeHud').addEventListener('click', () => { Snd.tap(); goTitle(); });
$('bSky').addEventListener('click', () => { Snd.tap(); goSky(false); });
$('bSkyMap').addEventListener('click', () => { Snd.tap(); goMap(); });
$('bSkyGo').addEventListener('click', () => { userStart(); Snd.tap(); travel(4, () => startLevel(BOSS)); });
$('photoThumb').addEventListener('click', () => { Snd.tap(); showScreen('sPhoto'); Voice.say(`To dla ciebie, ${NICK}!`); });
$('sPhoto').addEventListener('click', () => { showScreen('sThanks'); });
$('bThanksMap').addEventListener('click', () => { Snd.tap(); goMap(3); });
$('sSplash').addEventListener('click', () => { userStart(); Snd.giggle(); goTitle(); });
function setStat() {
  const done = LEVELS.filter((_, i) => isDone(i)).length;
  $('setStat').textContent = `Gwiazdki: ${totalStars()} z ${MAX_STARS} · ukończone poziomy: ${done} z ${LEVELS.length}${save.bossDone ? ' · zamek zdobyty' : ''}`;
}
$('bSet').addEventListener('click', () => { Snd.tap(); setStat(); $('resetAsk').classList.add('hide'); $('bReset').classList.remove('hide'); showScreen('sSet'); });
$('bSetClose').addEventListener('click', () => { Snd.tap(); showScreen('sTitle'); });
$('bReset').addEventListener('click', () => { $('bReset').classList.add('hide'); $('resetAsk').classList.remove('hide'); });
$('bResetNo').addEventListener('click', () => { $('resetAsk').classList.add('hide'); $('bReset').classList.remove('hide'); });
$('bResetYes').addEventListener('click', () => { resetProgress(); setStat(); $('resetAsk').classList.add('hide'); $('bReset').classList.remove('hide'); toast('Postęp wyzerowany.'); });
$('bKnowReset').addEventListener('click', () => { save.know = {}; persist(); toast('Okienka z opisem przedmiotów będą się znowu pokazywać.'); });
$('bWinMap').addEventListener('click', () => { Snd.tap(); goMap(LEVELS[Math.min(L.idx + 1, LEVELS.length - 1)].p); });
$('bFinal').addEventListener('click', () => { Snd.tap(); goMap(PLANETS.length - 1); });
$('bRepeat').addEventListener('click', () => { if (TK) Voice.say(TK.t.say); });
$('bIntroGo').addEventListener('click', () => { userStart(); Snd.tap(); Voice.stop(); const f = introThen; introThen = null; if (f) f(); });
$('bItemOk').addEventListener('click', () => { Snd.tap(); closeItemInfo(); });
document.addEventListener('pointerup', () => ensureFull(), true);
$$('.tgM').forEach(b => b.addEventListener('click', () => {
  save.music = !save.music; persist(); Snd.init(); Music.apply(); if (save.music) Music.restart(); setToggles();
}));
$$('.tgS').forEach(b => b.addEventListener('click', () => {
  save.sound = !save.sound; persist(); Snd.init(); if (!save.sound) Voice.stop(); else Snd.tap(); setToggles();
}));

if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

function goSplash() { scene = 'splash'; L = null; setPlayUi(false); showScreen('sSplash'); setAmb('space'); }
setToggles();
resize();
goSplash();
requestAnimationFrame(frame);


})();
</script>
</body>
</html>
