<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luci</title>
<meta name="description" content="Luci, neonowa ośmiornica Lucid Academy, w Twoim telefonie.">
<meta name="theme-color" content="#0B0620">
<!-- tylko-pwa -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikona-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luci">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- /tylko-pwa -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;500&family=Onest:wght@400;500&display=swap">
<style>
  /* Layout: a tall night aquarium. The time floats near the surface, Luci's den rests on the sand, the one switch waits under the glass. */
  :root {
    --woda: #0B0620;          /* upper water, violet night */
    --glebia: #05020D;        /* the deep */
    --swiatlo: #3DE3F0;       /* bioluminescence, the same cyan as her eyes */
    --neon: #B44CFF;          /* her violet neon rim */
    --tekst: #EFEAFF;
    --mgla: #A99DD3;          /* quiet text */
    --kamien: #1B1236;        /* den stone */
    --kamien-swiatlo: #3A2A6E;
    --font-zegar: "Unbounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --font-tekst: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(180, 76, 255, .22), transparent 60%),
      radial-gradient(90% 40% at 50% 112%, rgba(61, 227, 240, .10), transparent 70%),
      linear-gradient(180deg, var(--woda), var(--glebia));
    color: var(--tekst);
    font: 16px/1.5 var(--font-tekst);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .akwarium {
    position: relative; box-sizing: border-box; height: 100%;
    display: grid; grid-template-rows: auto auto 1fr auto auto; justify-items: center;
    padding-inline: max(16px, env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
    padding-block: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  /* room above the clock (her favourite perch), so her head stays clear of the screen's top edge */
  .gora { display: grid; gap: .5rem; padding-top: clamp(60px, 12.5vh, 140px); }
  .data { margin: 0; font: 500 clamp(15px, 4.2vw, 19px)/1.3 var(--font-tekst); color: var(--mgla); letter-spacing: .02em; text-wrap: balance; }
  .zegar {
    margin: 0; font: 200 clamp(64px, 21vw, 150px)/1 var(--font-zegar); letter-spacing: -.04em;
    font-variant-numeric: tabular-nums; color: var(--tekst);
    text-shadow: 0 0 .18em rgba(61, 227, 240, .35), 0 0 .6em rgba(180, 76, 255, .25);
  }
  .fakt {
    margin: clamp(10px, 3vh, 28px) 0 0; max-width: 30ch; display: grid; gap: .35rem; cursor: pointer;
    font-size: clamp(14px, 3.8vw, 16px); line-height: 1.45; color: var(--mgla); text-wrap: pretty;
  }
  .fakt b { font-weight: 500; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--swiatlo); opacity: .8; }
  .fakt p { margin: 0; }
  .dno { align-self: end; width: min(240px, 62vw); margin-bottom: 18px; }
  .nora { display: block; width: 100%; height: auto; overflow: visible; }
  .przelacznik {
    display: inline-flex; align-items: center; gap: .6rem; min-height: 56px; padding: 0 1.6rem 0 1.2rem;
    border: 1px solid rgba(61, 227, 240, .55); border-radius: 999px; cursor: pointer;
    background: rgba(61, 227, 240, .10); color: var(--tekst);
    font: 500 17px/1 var(--font-tekst); letter-spacing: .01em;
    box-shadow: 0 0 24px rgba(61, 227, 240, .25), inset 0 0 12px rgba(61, 227, 240, .12);
    transition: background .3s, border-color .3s, box-shadow .3s, color .3s;
  }
  .przelacznik svg { width: 22px; height: 22px; stroke: var(--swiatlo); transition: stroke .3s; }
  .przelacznik[aria-pressed="false"] { background: transparent; border-color: rgba(169, 157, 211, .35); box-shadow: none; color: var(--mgla); }
  .przelacznik[aria-pressed="false"] svg { stroke: var(--mgla); }
  .przelacznik:focus-visible { outline: 2px solid var(--swiatlo); outline-offset: 4px; }
  .wskazowka { margin: .9rem 0 0; min-height: 1.4em; max-width: 34ch; font-size: 13px; line-height: 1.4; color: var(--mgla); }
  .wskazowka button { font: inherit; color: var(--swiatlo); background: none; border: 0; padding: .2rem .3rem; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  /* plankton drifting up through the water */
  .plankton { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .plankton i { position: absolute; bottom: -8px; width: 3px; height: 3px; border-radius: 50%; background: var(--swiatlo); opacity: 0; animation: dryf linear infinite; }
  @keyframes dryf { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .5; } 85% { opacity: .35; } 100% { transform: translate(var(--x, 20px), -105vh); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .plankton { display: none; } .przelacznik { transition: none; } }
  @media (orientation: landscape) and (max-height: 520px) {
    .akwarium { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto auto; column-gap: 24px; align-items: center; }
    .gora { grid-column: 1; grid-row: 1; padding-top: 0; }
    .fakt { grid-column: 2; grid-row: 1; margin: 0; }
    .dno { display: none; }
    .przelacznik { grid-column: 1 / -1; grid-row: 2; }
    .wskazowka { grid-column: 1 / -1; grid-row: 3; }
    .zegar { font-size: clamp(48px, 13vw, 110px); }
  }
</style>
</head>
<body>
<div class="plankton" aria-hidden="true"></div>
<main class="akwarium">
  <header class="gora">
    <h1 class="zegar" id="zegar" data-osmiornica-cel aria-live="off">12:00</h1>
    <h2 class="data" id="data">środa, 7 października</h2>
  </header>
  <div class="fakt" id="fakt" role="button" tabindex="0" aria-label="Następna ciekawostka">
    <b>Z życia ośmiornic</b>
    <p id="fakt-tekst">Ośmiornica ma trzy serca: dwa pompują krew przez skrzela, trzecie przez resztę ciała.</p>
  </div>
  <div class="dno">
    <!-- her den: a stone mound she likes to sit on -->
    <svg class="nora" viewBox="0 0 240 92" data-osmiornica-podest aria-hidden="true">
      <defs>
        <linearGradient id="kamien" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--kamien-swiatlo)"/>
          <stop offset="1" stop-color="var(--kamien)"/>
        </linearGradient>
      </defs>
      <path d="M4 92 C14 52 52 18 102 4 C114 1 128 1 140 5 C186 20 226 54 236 92 Z" fill="url(#kamien)"/>
      <path d="M86 92 C88 66 102 52 120 52 C138 52 152 66 154 92 Z" fill="var(--glebia)"/>
      <path d="M102 4 C114 1 128 1 140 5" fill="none" stroke="var(--swiatlo)" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="44" cy="84" rx="9" ry="5" fill="var(--kamien-swiatlo)"/>
      <ellipse cx="196" cy="86" rx="12" ry="5" fill="var(--kamien-swiatlo)"/>
      <path d="M172 76 q6 -9 12 0 q-6 4 -12 0 Z" fill="var(--neon)" fill-opacity=".55"/>
    </svg>
  </div>
  <button class="przelacznik" id="przelacznik" type="button" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/></svg>
    <span id="etykieta">Wyłącz Luci</span>
  </button>
  <p class="wskazowka" id="wskazowka"></p>
</main>

<script>window.OSMIORNICA = { mode: 'lecture', stayMin: 1e6 }</script>
<script src="../osmiornica.js" defer></script>
<script>
  // ---------- clock, date and an octopus fact of the day ----------
  const FAKTY = [
    'Ośmiornica ma trzy serca: dwa pompują krew przez skrzela, trzecie przez resztę ciała.',
    'Krew ośmiornicy jest niebieska, bo tlen przenosi w niej hemocyjanina z miedzią zamiast żelaza.',
    'Około dwóch trzecich neuronów ośmiornicy siedzi w ramionach, a nie w mózgu.',
    'Przyssawki nie tylko trzymają: ośmiornica czuje nimi smak tego, czego dotyka.',
    'Jedyna twarda część ciała ośmiornicy to dziób, więc przeciśnie się przez każdą większą szczelinę.',
    'Źrenica ośmiornicy to pozioma szparka, która zostaje pozioma, nawet gdy ośmiornica się obróci.',
    'Ośmiornice prawdopodobnie nie rozróżniają barw, a mimo to bezbłędnie dopasowują kolor do tła.',
    'Ośmiornica żyłkowana nosi ze sobą połówki łupin kokosa i chowa się w nich jak w przenośnym domu.',
    'Śpiące ośmiornice zmieniają kolory skóry. Badacze podejrzewają, że to coś w rodzaju snów.',
    'Ośmiornice rozpoznają poszczególnych ludzi. W akwariach zdarza się, że pryskają wodą w nielubianego opiekuna.',
    'Ramię ośmiornicy potrafi samo wykonać część ruchu, bez rozkazów z mózgu.',
    'Większość gatunków ośmiornic żyje krótko, zwykle rok lub dwa.',
  ];
  const $ = id => document.getElementById(id);
  const dzien = new Intl.DateTimeFormat('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
  const nrDnia = d => Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
  let fakt = nrDnia(new Date()) % FAKTY.length;
  function czas() {
    const d = new Date(), t = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'), dz = dzien.format(d);
    if ($('zegar').textContent !== t) $('zegar').textContent = t;
    if ($('data').textContent !== dz) $('data').textContent = dz;
    setTimeout(czas, 60000 - d.getSeconds() * 1000 - d.getMilliseconds() + 30);
  }
  function pokazFakt() { $('fakt-tekst').textContent = FAKTY[fakt]; }
  function nastepnyFakt() { fakt = (fakt + 1) % FAKTY.length; pokazFakt(); }
  $('fakt').addEventListener('click', nastepnyFakt);
  $('fakt').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); nastepnyFakt(); } });
  czas(); pokazFakt();

  // plankton, a handful of specks
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const pl = document.querySelector('.plankton');
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('i');
      s.style.left = (Math.random() * 100).toFixed(1) + '%';
      s.style.setProperty('--x', ((Math.random() - .5) * 60).toFixed(0) + 'px');
      s.style.animationDuration = (18 + Math.random() * 22).toFixed(1) + 's';
      s.style.animationDelay = (-Math.random() * 40).toFixed(1) + 's';
      if (Math.random() < .3) s.style.background = 'var(--neon)';
      pl.appendChild(s);
    }
  }

  // ---------- the one switch, and Luci's life when she is on ----------
  const KLUCZ = 'luci.telefon';
  const czytaj = () => { try { return localStorage.getItem(KLUCZ); } catch (e) { return null; } };
  const zapisz = v => { try { localStorage.setItem(KLUCZ, v); } catch (e) { /* private mode: she just forgets */ } };
  let wlaczona = czytaj() !== 'wylaczona', zegarZycia = 0, spiOd = 0;

  function pokazStan() {
    $('przelacznik').setAttribute('aria-pressed', String(wlaczona));
    $('etykieta').textContent = wlaczona ? 'Wyłącz Luci' : 'Włącz Luci';
  }
  function zaplanuj(sek) { clearTimeout(zegarZycia); zegarZycia = setTimeout(zycie, (sek || 40 + Math.random() * 80) * 1000); }
  // every minute or two: she comes back if she swam off, plays a prank when awake, and is let to dream when asleep
  function zycie() {
    if (!wlaczona || !window.Osmiornica) return;
    if (document.hidden) return zaplanuj(20);
    const s = Osmiornica.state;
    if (s === 'hidden') Osmiornica.summon();
    else if (s === 'rest') { spiOd = 0; if (Math.random() < .7) Osmiornica.summon(); }
    else if (s === 'sleep') {
      spiOd = spiOd || Date.now();
      if (Date.now() - spiOd > 4 * 60e3 && Math.random() < .5) { spiOd = 0; Osmiornica.summon('pobudka'); }
    }
    zaplanuj();
  }
  function wejdz() { Osmiornica.summon(Math.random() < .7 ? 'upadek' : 'sen'); zaplanuj(); }
  // after she inks and flees (or swims off after a prank) she comes back within half a minute
  let ukrytaOd = 0, powrot = 15000;
  setInterval(() => {
    if (!wlaczona || !window.Osmiornica || document.hidden || Osmiornica.state !== 'hidden') { ukrytaOd = 0; return; }
    ukrytaOd = ukrytaOd || Date.now();
    if (Date.now() - ukrytaOd > powrot) { ukrytaOd = 0; powrot = (12 + Math.random() * 18) * 1000; Osmiornica.summon(); }
  }, 3000);
  function przelacz() {
    if (!window.Osmiornica) return;
    wlaczona = !wlaczona; zapisz(wlaczona ? 'wlaczona' : 'wylaczona'); pokazStan();
    try { navigator.vibrate && navigator.vibrate(12); } catch (e) { /* no vibration here */ }
    if (wlaczona) wejdz();
    else { clearTimeout(zegarZycia); if (Osmiornica.state !== 'hidden') Osmiornica.hide(); }
  }
  pokazStan();
  $('przelacznik').addEventListener('click', przelacz);
  addEventListener('load', () => { if (wlaczona && window.Osmiornica) setTimeout(wejdz, 900); });
  window.__luci = { zycie, przelacz };
</script>
<!-- tylko-pwa -->
<script>
  // works offline after the first visit
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  // a gentle hint on how to put Luci on the home screen (gone once she is installed)
  (() => {
    const w = document.getElementById('wskazowka');
    const zainstalowana = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    if (zainstalowana) return;
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    w.textContent = ios ? 'Na ekran początkowy: Udostępnij, potem „Do ekranu początkowego”.' : 'Na ekran główny: menu przeglądarki, potem „Zainstaluj aplikację”.';
    let prosba = null;
    addEventListener('beforeinstallprompt', e => {
      e.preventDefault(); prosba = e;
      w.textContent = '';
      const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Zainstaluj Luci na telefonie';
      b.addEventListener('click', async () => { prosba.prompt(); await prosba.userChoice; prosba = null; w.textContent = ''; });
      w.appendChild(b);
    });
    addEventListener('appinstalled', () => { w.textContent = ''; });
  })();
</script>
<!-- /tylko-pwa -->
</body>
</html>
